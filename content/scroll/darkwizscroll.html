<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>darkwizscroll · CEMP</title>
<meta name="application-name" content="darkwizscroll">
<meta name="apple-mobile-web-app-title" content="darkwizscroll">
<meta name="description" content="darkwizscroll turns doomscrolling into real civil engineering site knowledge, one card at a time.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffcf1f'/%3E%3Cpath d='M8 7H24V11H18V21H24V25H8V21H14V11H8Z' fill='%230a1524'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* VOICE: a site engineer's field notebook that scrolls like a social feed.
   IDEA: every card is a drafting sheet with a title block; night = blueprint, day = whiteprint.
   PICTURE: the full-height card itself, with its diagram, table or site call.
   COLOUR and TYPE: navy sheet / white sheet, hi-vis accent (swappable in the Spark Market), cyanotype history; condensed Big Shoulders, Barlow body, Plex Mono for sheet data.
   LAYOUT: snap feed; sidebar on wide screens, top bar + tab bar on phones; tools open in a side sheet. */
:root{
  --hivis:#ffcf1f; --acc-dark:#ffcf1f; --acc-light:#8a6400; --hivis-deep:#5a4800;
  --on-hivis:#0a1524;
  --bg:#0a1524; --sheet:#0e1f35; --sheet-2:#112744; --line:#24405f;
  --grid:rgba(140,182,230,.055); --grid-strong:rgba(140,182,230,.12);
  --text:#e6edf5; --muted:#8fa3bb; --acc:var(--acc-dark);
  --ink-line:rgba(10,21,36,.3); --ink-grid:rgba(10,21,36,.08); --ink-grid2:rgba(10,21,36,.15);
  --cyan:#1b4a86; --cyan-fg:#f3f7fc; --cyan-muted:#bcd0ea; --cyan-line:rgba(243,247,252,.34); --cyan-grid:rgba(243,247,252,.06); --cyan-grid2:rgba(243,247,252,.13);
  --ok:#3fd49f; --ok-bg:rgba(63,212,159,.12); --bad:#ff6b5a; --bad-bg:rgba(255,107,90,.12);
  --opt-bg:rgba(10,21,36,.55); --scrim:rgba(4,9,16,.66); --field:#0a1524;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-mode]){
    --bg:#e9eef5; --sheet:#ffffff; --sheet-2:#f3f6fa; --line:#c9d4e2;
    --grid:rgba(14,40,80,.045); --grid-strong:rgba(14,40,80,.09);
    --text:#0e1f35; --muted:#4c5e75; --acc:var(--acc-light);
    --ok:#0d8a5f; --ok-bg:rgba(13,138,95,.1); --bad:#c8321f; --bad-bg:rgba(200,50,31,.08);
    --opt-bg:#ffffff; --scrim:rgba(10,21,36,.38); --field:#ffffff; color-scheme:light;
  }
}
:root[data-mode="light"], :root[data-theme="light"]:not([data-mode]){
  --bg:#e9eef5; --sheet:#ffffff; --sheet-2:#f3f6fa; --line:#c9d4e2;
  --grid:rgba(14,40,80,.045); --grid-strong:rgba(14,40,80,.09);
  --text:#0e1f35; --muted:#4c5e75; --acc:var(--acc-light);
  --ok:#0d8a5f; --ok-bg:rgba(13,138,95,.1); --bad:#c8321f; --bad-bg:rgba(200,50,31,.08);
  --opt-bg:#ffffff; --scrim:rgba(10,21,36,.38); --field:#ffffff; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.pr-badge{align-self:flex-start;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid var(--line)}
.pr-badge.ok{color:var(--ok);border-color:currentColor}.pr-badge.rev{color:var(--acc);border-color:currentColor}
.pr-list ul{margin:.2rem 0 0;padding-left:1.1rem;display:grid;gap:.25rem;font-size:.95rem;line-height:1.35}
.pr-do .eyebrow{color:var(--ok)}.pr-avoid .eyebrow{color:var(--bad,#ff6b5a)}
.dia.pr-dia{background:#fff;border-radius:10px;padding:6px}.dia.pr-dia svg{width:100%;max-width:none;height:auto;max-height:36vh}
.t-practice .content{justify-content:flex-start}.t-practice .content>:first-child{margin-top:auto}.t-practice .content>:last-child{margin-bottom:auto}
@media (max-width:640px){.dia.pr-dia svg{max-height:24vh}.pr-list li:nth-child(n+4){display:none}.pr-list ul{font-size:.9rem}}
.pr-foot{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}.pr-refs{font:500 12px/1.3 var(--f-mono);color:var(--muted)}
.to-cemp{display:flex;align-items:center;gap:10px;align-self:stretch;font:700 15px/1.1 var(--f-body,system-ui);color:#0f1b2d;background:#f5c518;text-decoration:none;border:2px solid #0f1b2d;border-radius:12px;padding:10px 14px;box-shadow:3px 3px 0 #0f1b2d;transition:transform .1s,box-shadow .1s}
.to-cemp .tc-ar{font-size:20px;line-height:1}
.to-cemp .tc-t{display:flex;flex-direction:column;gap:2px}
.to-cemp .tc-t small{font:600 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.to-cemp:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #0f1b2d}
.to-cemp:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0f1b2d}
.to-cemp.sm{align-self:center;gap:6px;padding:7px 12px;font-size:14px;border-radius:10px;box-shadow:2px 2px 0 #0f1b2d}
.tl-left{display:flex;align-items:center;gap:10px}
.side{display:none}
.stage{height:100%;min-height:0;min-width:0;display:flex;flex-direction:column}
@media (min-width:960px){
  .app{grid-template-columns:280px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:20px;padding:22px 20px;border-right:1px solid var(--line);overflow-y:auto;background:var(--bg)}
}
.brand{display:flex;align-items:center;gap:10px;font:800 25px/1 var(--f-display);letter-spacing:.01em;color:var(--text);text-transform:lowercase}
.brand svg{width:30px;height:30px;flex:none}
.brand b{color:var(--acc);font-weight:800}
.brand.sm{font-size:22px}
.brand.sm svg{width:26px;height:26px}
.label{font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:3px;background:none;color:var(--text);text-align:left;font:500 15px/1.2 var(--f-body);cursor:pointer}
.nav button:hover{background:var(--sheet)}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto;font:500 11px/1 var(--f-mono);color:var(--muted)}
.catlist{display:flex;flex-direction:column;gap:2px}
.catlist .catbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;background:none;color:var(--muted);text-align:left;font:500 15px/1.2 var(--f-body);border-radius:3px;cursor:pointer}
.catlist .catbtn i{font:400 10.5px/1 var(--f-mono);font-style:normal;letter-spacing:.08em}
.catlist .catbtn:hover{color:var(--text);background:var(--sheet)}
.catlist .catbtn[aria-pressed="true"]{color:var(--on-hivis);background:var(--hivis)}
.sidestats{display:grid;border:1px solid var(--line);margin:0}
.sidestats div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.sidestats div:last-child{border-bottom:0}
.sidestats dt{font-size:14px;color:var(--muted)}
.sidestats dd{margin:0;font:500 14px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--text)}
.keys{font:400 11px/1.7 var(--f-mono);color:var(--muted);margin:0}
.keys kbd{font:500 10.5px/1 var(--f-mono);border:1px solid var(--line);padding:2px 5px;border-radius:2px;color:var(--text)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:6px;border:0;border-right:1px solid var(--line);background:none;color:var(--muted);font:500 14px/1 var(--f-body);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--hivis);color:var(--on-hivis)}
.seg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 16px;border-radius:3px;border:1px solid var(--line);background:none;color:var(--text);font:600 15px/1 var(--f-body);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--hivis);border-color:var(--hivis);color:var(--on-hivis)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{min-height:34px;padding:7px 11px;font-size:13.5px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.spk{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.spk svg{width:13px;height:13px;fill:var(--acc);stroke:none}

/* ---------- phone chrome ---------- */
.topbar{flex:none;display:flex;flex-direction:column;gap:9px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 9px;border-bottom:1px solid var(--line);background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mini{display:flex;gap:12px;align-items:center;font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mini b{color:var(--acc);font-weight:500;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chips .catbtn{flex:none;padding:7px 11px;border:1px solid var(--line);background:none;border-radius:999px;color:var(--muted);font:500 13.5px/1 var(--f-body);cursor:pointer;white-space:nowrap}
.chips .catbtn[aria-pressed="true"]{background:var(--hivis);border-color:var(--hivis);color:var(--on-hivis)}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:8px 2px 9px;border:0;background:none;color:var(--muted);font:500 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="true"]{color:var(--acc)}
@media (min-width:960px){.topbar,.tabbar{display:none}}

/* ---------- feed ---------- */
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none;outline:none}
.feed::-webkit-scrollbar{display:none}
.card{
  --c-fg:var(--text);--c-muted:var(--muted);--c-acc:var(--acc);--c-line:var(--line);--c-bg:var(--sheet);
  --c-grid:var(--grid);--c-grid2:var(--grid-strong);
  position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  color:var(--c-fg);background-color:var(--c-bg);
  background-image:linear-gradient(var(--c-grid2) 1px,transparent 1px),linear-gradient(90deg,var(--c-grid2) 1px,transparent 1px),linear-gradient(var(--c-grid) 1px,transparent 1px),linear-gradient(90deg,var(--c-grid) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,16px 16px,16px 16px;background-position:-1px -1px;
}
.t-quiz,.t-steps{--c-bg:var(--sheet-2)}
.t-number{--c-fg:var(--on-hivis);--c-muted:var(--hivis-deep);--c-acc:var(--on-hivis);--c-line:var(--ink-line);--c-bg:var(--hivis);--c-grid:var(--ink-grid);--c-grid2:var(--ink-grid2)}
.t-history{--c-fg:var(--cyan-fg);--c-muted:var(--cyan-muted);--c-acc:var(--cyan-fg);--c-line:var(--cyan-line);--c-bg:var(--cyan);--c-grid:var(--cyan-grid);--c-grid2:var(--cyan-grid2)}
.t-welcome,.t-check{--c-bg:var(--bg)}
.t-myth::before,.t-scenario::before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:repeating-linear-gradient(-45deg,var(--hivis) 0 14px,var(--on-hivis) 14px 28px)}
.frame{height:100%;max-width:700px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:10px;padding:22px 10px 26px 18px}
.frame.solo{grid-template-columns:minmax(0,1fr);padding-right:18px}
@media (min-width:960px){.frame{padding:40px 20px 44px 32px;gap:28px}.frame.solo{padding-right:32px}}
.content{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:13px;overflow-y:auto;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c-muted)}
.meta .chip{border:1px solid var(--c-acc);color:var(--c-acc);padding:5px 8px 4px;border-radius:2px}
.meta .tag{background:var(--c-fg);color:var(--c-bg);padding:5px 7px 4px;border-radius:2px}
.meta .com{border:1px dashed var(--c-acc);color:var(--c-acc);padding:4px 7px 3px;border-radius:2px}
.meta .by{text-transform:none;letter-spacing:.02em}
.title{margin:0;font:800 clamp(34px,8.4vw,56px)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;overflow-wrap:anywhere}
.title.sm{font-size:clamp(28px,6.6vw,42px)}
.body{margin:0;max-width:62ch;font-size:clamp(15.5px,2.05vh,17.5px);line-height:1.5;color:var(--c-fg);overflow-wrap:anywhere}
.callout{position:relative;padding:15px 16px 13px;border:1px solid var(--c-line);margin-top:4px}
.callout::before{content:"";position:absolute;inset:-1px;pointer-events:none;background:linear-gradient(var(--c-acc),var(--c-acc)) top left/14px 2px no-repeat,linear-gradient(var(--c-acc),var(--c-acc)) top left/2px 14px no-repeat,linear-gradient(var(--c-acc),var(--c-acc)) bottom right/14px 2px no-repeat,linear-gradient(var(--c-acc),var(--c-acc)) bottom right/2px 14px no-repeat}
.callout-label{position:absolute;top:-7px;left:12px;padding:0 6px;background:var(--c-bg);font:500 10px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-acc)}
.formula{font:500 clamp(17px,4.4vw,23px)/1.3 var(--f-mono);color:var(--c-acc);overflow-wrap:anywhere}
.legend{margin-top:6px;font:400 12.5px/1.55 var(--f-mono);color:var(--c-muted)}
.rows{margin:0;display:grid;border:1px solid var(--c-line);max-width:560px}
.rows div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--c-line)}
.rows div:last-child{border-bottom:0}
.rows dt{font-size:14px;line-height:1.35;color:var(--c-muted);overflow-wrap:anywhere}
.rows dd{margin:0;font:500 13px/1.4 var(--f-mono);color:var(--c-acc);overflow-wrap:anywhere}
.dia{margin:0}
.dia svg{display:block;width:100%;max-width:340px;max-height:134px;height:auto}
.dia .l{stroke:var(--c-fg);stroke-width:1.5;fill:none;stroke-linejoin:round}
.dia .a{stroke:var(--c-acc);stroke-width:1.6;fill:none;stroke-linejoin:round}
.dia .af{fill:var(--c-acc);stroke:none}
.dia .bm,.dia .bc{fill:var(--c-fg);stroke:none}
.dia .bg{fill:var(--c-bg);stroke:var(--c-fg);stroke-width:1.5}
.dia .m{fill:var(--c-acc);fill-opacity:.16;stroke:var(--c-acc);stroke-width:1.2}
.dia .d{stroke:var(--c-muted);stroke-width:1;stroke-dasharray:3 3;fill:none}
.dia .nz{fill:var(--bad);fill-opacity:.24;stroke:none}
.dia .lean{fill:var(--c-muted);fill-opacity:.3;stroke:none}
.dia .cr{stroke:var(--bad);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia text{font:500 10.5px var(--f-mono);fill:var(--c-muted)}
.dia text.k{fill:var(--c-acc)}
.dia text.bd{fill:var(--bad)}
.note{margin:0;max-width:62ch;font-size:14.5px;line-height:1.45;color:var(--c-muted);overflow-wrap:anywhere}
.note span{display:block;margin-bottom:3px;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-acc)}
.tblock{display:flex;flex-wrap:wrap;border:1px solid var(--c-line);font:400 9.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);margin-top:2px}
.tblock span{padding:6px 8px;border-right:1px solid var(--c-line)}
.tblock span:last-child{border-right:0;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.tblock .tb-brand{color:var(--c-fg);font-weight:500;text-transform:lowercase;letter-spacing:.04em}
.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.big-n{font:800 clamp(80px,24vw,170px)/.82 var(--f-display);letter-spacing:-.015em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.big-u{font:700 clamp(22px,5vw,34px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.year{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px}
.year b{font:800 clamp(70px,20vw,148px)/.82 var(--f-display);letter-spacing:-.01em}
.year span{font:500 12px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-muted)}
.stamp{align-self:flex-start;padding:6px 11px 4px;border:2px solid var(--bad);color:var(--bad);font:800 22px/1 var(--f-display);letter-spacing:.14em;transform:rotate(-2.5deg)}
.stamp.ok{border-color:var(--ok);color:var(--ok);transform:rotate(1.5deg)}
.myth{margin:0;max-width:30ch;font:700 clamp(23px,5.4vw,31px)/1.12 var(--f-display);text-transform:uppercase;color:var(--c-muted);text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px;overflow-wrap:anywhere}
.eyebrow{margin:0;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-acc)}
.live{display:inline-flex;align-items:center;gap:8px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.sit{margin:0;max-width:30ch;font:700 clamp(24px,5.4vw,34px)/1.1 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.sit::before{content:"\201C";color:var(--c-acc);margin-right:2px}
.sit::after{content:"\201D";color:var(--c-acc)}
.ans{display:flex;flex-direction:column;gap:10px}
.ans ol{margin:0;padding:0;list-style:none;display:grid;gap:7px;counter-reset:s;max-width:62ch}
.ans li{position:relative;padding-left:32px;font-size:15.5px;line-height:1.42;counter-increment:s;overflow-wrap:anywhere}
.ans li::before{content:counter(s);position:absolute;left:0;top:1px;display:grid;place-items:center;width:22px;height:22px;border:1px solid var(--c-acc);color:var(--c-acc);font:500 11px/1 var(--f-mono);border-radius:2px}
.reveal,.stepbtn{align-self:flex-start}
.stepnav{display:flex;gap:6px;align-items:center}
.dot{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--c-line);border-radius:2px;background:none;color:var(--c-muted);font:500 12px/1 var(--f-mono);cursor:pointer}

.wallet{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:16px;border:1px solid var(--line);background:var(--bg)}

.wallet small{display:block;font-size:13.5px;color:var(--muted);max-width:30ch}

.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);flex:none}
.form{display:grid;gap:12px}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pvwrap{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.card.pv{height:auto;scroll-snap-align:none;user-select:text}

.card.pv .content{overflow:visible}
.card.pv .title{font-size:34px}.card.pv .big-n{font-size:84px}
.status{padding:10px 12px;border:1px solid var(--line);border-radius:3px;font-size:14px;color:var(--muted)}

.vote{display:grid;gap:6px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--text);text-align:left;cursor:pointer}
.vote:hover{border-color:var(--acc)}
.vote[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.vote .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.vote b{font:700 18px/1.1 var(--f-display);text-transform:uppercase}
.vote em{font:500 11.5px/1 var(--f-mono);font-style:normal;color:var(--muted);white-space:nowrap}
.vote .bar{height:6px;background:var(--line);border-radius:1px;overflow:hidden}
.vote .bar i{display:block;height:100%;background:var(--hivis)}
.vote small{font-size:13px;color:var(--muted)}
.log{display:grid;gap:0;border:1px solid var(--line)}
.log div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}

.log b{font:500 12px/1.4 var(--f-mono);color:var(--acc)}
.idea{padding:10px 12px;border:1px solid var(--line);background:var(--bg);font-size:14.5px}
.idea small{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.steps-how{display:grid;gap:10px;margin:0;padding:0;list-style:none}

.steps-how svg{width:28px;height:28px;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

<script>
/* CEMP shim (v2.1.0): darkwizscroll was a claude.ai artifact that used window.claude.use("db"/"user").
   Inside CEMP the same calls go to /api/scroll (Supabase, signed-in CEMP users). Snapshots poll every 30 s

(function(){
  var API="/api/scroll", subs={}, ERR={400:"invalid_argument",403:"invalid_argument",413:"quota_exceeded",429:"resource_exhausted"};
  function call(method,qs,body){
    return fetch(API+(qs||""),{method:method,credentials:"same-origin",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined})
      .then(function(r){var ct=r.headers.get("content-type")||"";if(!r.ok||ct.indexOf("json")<0){return r.json().catch(function(){return {};}).then(function(j){var e=new Error(j.message||"request failed");e.code=j.code||ERR[r.status]||"unavailable";throw e;});}return r.json();});
  }
  function snap(docs){return {metadata:{fromCache:false},docs:docs.map(function(d){return {id:d.id,exists:true,data:function(){return d.data;}};})};}
  function refresh(c){var L=subs[c];if(!L||!L.length)return;call("GET","?c="+c).then(function(j){var s=snap(j.docs||[]);L.forEach(function(l){try{l.cb(s);}catch(e){}});},function(e){L.forEach(function(l){if(l.err)l.err(e);});});}
  setInterval(function(){if(document.visibilityState==="visible")Object.keys(subs).forEach(refresh);},30000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")Object.keys(subs).forEach(refresh);});
  var db={
    collection:function(c){return {onSnapshot:function(cb,err){var l={cb:cb,err:err};(subs[c]=subs[c]||[]).push(l);refresh(c);return function(){subs[c]=subs[c].filter(function(x){return x!==l;});};}};},
    doc:function(path){var p=String(path).split("/"),c=p[0],id=p[1];return {
      get:function(){return call("GET","?c="+c+"&id="+encodeURIComponent(id)).then(function(j){var d=(j.docs||[])[0];return {id:id,exists:!!d,data:function(){return d?d.data:undefined;}};});},
      set:function(data){return call("POST","",{op:"set",c:c,id:id,data:data}).then(function(){refresh(c);});}
    };}
  };
  var mePromise=null;function me(){return mePromise||(mePromise=call("GET","?me=1"));}
  var user={
    id:function(){return me().then(function(m){return m.uid;});},
    isOwner:function(){return me().then(function(m){return !!m.isOwner;});},
    canEdit:function(){return me().then(function(m){return !!m.canEdit;});},
    can:function(){return me().then(function(m){return !!m.canWrite;});},
    profiles:function(ids){return call("POST","",{op:"names",ids:ids}).then(function(j){return j.names||{};});}
  };
  window.claude=window.claude||{};
  window.claude.use=function(name){return Promise.resolve(name==="db"?db:name==="user"?user:null);};
})();
</script>
<script>
{
"use strict";

/* =====================================================================
   CONTENT · base subject
   Card types: concept · steps · scenario · myth · number · history · quiz
   Code references follow ACI 318-14 / NSCP 2015 unless noted.
   ===================================================================== */
const SUBJECTS = {
  civil: {
    name: "Civil Engineering",
    cats: [
      {id:"behavior", label:"How Structures Work", code:"SB"},
      {id:"rebar", label:"Rebar Detailing", code:"RD"},
      {id:"beams", label:"Beams & Slabs", code:"BS"},
      {id:"columns", label:"Columns", code:"C"},
      {id:"foundations", label:"Foundations", code:"F"},
      {id:"trusses", label:"Trusses & Roofs", code:"TR"},
      {id:"concreting", label:"Concreting", code:"CN"},
      {id:"steel", label:"Steelwork", code:"SW"},
      {id:"safety", label:"Site Safety", code:"SS"},
      {id:"estimating", label:"Estimating", code:"E"},
      {id:"history", label:"History", code:"HX"}
    ],
    cards: [
{id:"sb-moment", cat:"behavior", type:"steps", title:"How bending moment really works", ref:"Structural mechanics",
 steps:[
  {h:"It is a rotation problem", t:"Load pushes the beam down and the supports push up. Cut the beam anywhere and each piece wants to rotate. The internal bending moment is what stops that rotation at the cut.", dia:"udl"},
  {h:"The internal couple", t:"Inside the beam, concrete on one side is squeezed (C) and the steel on the other side is pulled (T). C equals T. The distance between them is the lever arm, and moment capacity is T times that lever arm.", dia:"couple"},
  {h:"Sagging and hogging", t:"Between supports the beam sags, so its bottom is in tension. Over interior supports it hogs, so its top is in tension. Bars go wherever the tension is, which is why continuous beams have top bars over the columns.", dia:"contin"},
  {h:"Where moment is zero", t:"Between sagging and hogging the moment passes through zero at the inflection point, roughly a fifth to a quarter of the span from an interior support. At least a third of the top bars must run past it by the greatest of d, 12db or Ln/16 before they are cut."}
 ]},
{id:"sb-shear", cat:"behavior", type:"steps", title:"Shear between zero and max", ref:"Structural mechanics",
 steps:[
  {h:"The sliding force", t:"At any cut, shear is the vertical force trying to slide one piece of the beam past the other. Under a uniform load it is largest at the supports, zero at midspan, and changes in a straight line between.", dia:"shear"},
  {h:"Shear at any point", t:"From a support, V(x) = w(L/2 − x). A 6 m beam carrying 30 kN/m has 90 kN at the support, 60 kN at 1 m, 45 kN at 1.5 m, 30 kN at 2 m, and zero at 3 m. Every point in between carries its own value."},
  {h:"Why it cracks at 45°", t:"Shear combines with bending into diagonal tension. Concrete cracks across it at roughly 45°, rising from the bottom near the support toward midspan. Stirrups cross those cracks and stitch them closed.", dia:"cracks"},
  {h:"Stirrups follow the diagram", t:"Design shear is checked at distance d from the support face. Stirrups are tightest there and open up toward midspan as shear drops, but never wider than d/2 or 600 mm where stirrups are required. That is the reason plans show two or three spacing zones."}
 ]},
{id:"sb-dmdx", cat:"behavior", type:"concept", title:"Max moment sits where shear is zero",
 body:"Shear is the slope of the moment diagram. Where shear crosses zero, moment stops rising and peaks. Under uneven loads, find the zero-shear point first; that is where the bottom bars work hardest.",
 key:"dM/dx = V", legend:"Point load: moment peaks under the load, where V changes sign",
 note:"On site this explains the pattern: bottom bars are heaviest near midspan, stirrups are tightest near supports.", ref:"Structural mechanics"},
{id:"sb-depth", cat:"behavior", type:"concept", title:"Effective depth, d",
 body:"d is measured from the compression face to the center of the tension bars, not to the bottom of the beam. It sets the lever arm, so flexural capacity rises almost in step with it.",
 key:"d = h − cover − stirrup − db/2", legend:"400 mm beam, 40 cover, 10 stirrup, 20 bar → d = 340 mm", dia:"depth",
 note:"With two layers, measure to the centroid of both. Every millimeter of extra cover added on site comes straight out of d.", ref:"ACI 318 §2.3 (definitions)"},
{id:"sb-load", cat:"behavior", type:"concept", title:"Follow the load path",
 body:"Every load needs an unbroken path to the ground. When a column is removed or a beam is cut in a renovation, that path breaks and the load looks for another one.",
 key:"Slab → Beam → Girder → Column → Footing → Soil",
 note:"Before approving any opening, demolition or column removal, trace the path both ways: what does this member carry, and what carries it?", ref:"Structural behavior"},
{id:"sb-cracks", cat:"behavior", type:"concept", title:"Reading cracks",
 body:"Crack direction tells you what the member is doing. Fine vertical cracks from the bottom at midspan are usually normal. Diagonal cracks near supports need an engineer's look.",
 rows:[["Vertical, bottom, midspan","Flexure"],["Diagonal ~45°, near a support","Shear"],["Straight along a bar line","Settlement or thin cover"],["Map pattern within hours","Plastic shrinkage"]],
 note:"Pencil-mark the crack ends with the date. Growth over weeks matters more than width on day one.", ref:"ACI 224R"},
{id:"sb-myth", cat:"behavior", type:"myth",
 myth:"You can core through a beam anywhere as long as you miss the bars.",
 fact:"Openings near supports cut through the zone of highest shear, and any hole reduces the web or compression zone. Small sleeves do least harm near mid-depth in the middle third of the span, and only with the engineer's approval.", ref:"Structural behavior"},
{id:"sb-q1", cat:"behavior", type:"quiz",
 q:"On a uniformly loaded simple beam, the shear at midspan is:",
 opts:["Zero","At its maximum","Half the support shear","Equal to the moment"], a:0,
 explain:"Shear drops linearly from wL/2 at each support to zero at midspan, which is exactly where the moment peaks."},
{id:"sb-q2", cat:"behavior", type:"quiz",
 q:"6 m beam, 30 kN/m uniform load. What is the shear 1.5 m from a support?",
 opts:["45 kN","90 kN","22.5 kN","0 kN"], a:0,
 explain:"V = w(L/2 − x) = 30 × (3 − 1.5) = 45 kN."},
{id:"rd-cover", cat:"rebar", type:"concept", title:"Concrete cover cheat sheet",
 body:"Cover protects bars from corrosion and fire and lets them bond. It is measured to the outermost steel, which is usually the stirrup or tie, not the main bar.",
 rows:[["Footing bottom, cast on soil","75 mm"],["Formed, backfilled or weather-exposed","50 mm (≥ 20 mm bars) · 40 mm (≤ 16 mm)"],["Beams & columns, interior","40 mm to stirrups / ties"],["Slabs & walls, interior","20 mm"]],
 note:"Fire ratings or a marine environment can require more. Check the general notes on the structural plans.", ref:"ACI 318 Table 20.6.1.3.1 · NSCP 2015"},
{id:"rd-beamspace", cat:"rebar", type:"concept", title:"Clear spacing of beam bars",
 body:"Concrete has to flow between and around the bars. Too tight and you get voids under them; too wide and cracks open wider than they should.",
 rows:[["Bars in one layer","≥ 25 mm, ≥ db, ≥ 4/3 × max aggregate"],["Between layers","≥ 25 mm, upper bars directly over lower"],["Max, crack control (Gr 60)","380 − 2.5cc, ≤ 300 mm"]],
 note:"With 25 mm (1 in) aggregate, 4/3 × 25 = 33 mm, so the 25 mm minimum is not enough. Check the aggregate size on the mix design.", ref:"ACI 318 §25.2 · §24.3.2"},
{id:"rd-slabspace", cat:"rebar", type:"concept", title:"Slab bar spacing",
 body:"Slabs carry two sets of bars: main bars for bending, and temperature bars that control shrinkage cracking in the other direction.",
 rows:[["Main bars","≤ 3h and ≤ 450 mm"],["Temperature bars","≤ 5h and ≤ 450 mm"],["Temperature steel, Gr 60","0.0018 × gross area"],["Temperature steel, Gr 40","0.0020 × gross area"]],
 note:"100 mm slab, Grade 40: 0.0020 × 1000 × 100 = 200 mm² per meter. 10 mm bars (78.5 mm²) at about 390 mm meet it.", ref:"ACI 318 §7.7.2 · §24.4.3"},
{id:"rd-lap", cat:"rebar", type:"concept", title:"Lap length in plain numbers",
 body:"A lap passes force from one bar to the next through the surrounding concrete, so it needs length. The common tension lap is Class B: 1.3 times the development length, never under 300 mm.",
 rows:[["16 mm, bottom bars","≈ 0.9 m"],["16 mm, top bars","≈ 1.2 m"],["20 mm, bottom bars","≈ 1.15 m"],["20 mm, top bars","≈ 1.5 m"]],
 note:"Assumes Grade 60 bars, 21 MPa concrete, uncoated, normal cover and spacing. Top bars get a 1.3 factor because bleed water weakens the concrete under them. The plan's lap schedule governs.", ref:"ACI 318 §25.4.2 · §25.5.2"},
{id:"rd-splice", cat:"rebar", type:"concept", title:"Where to splice beam bars",
 body:"Lap bars where they work least. Top bars are in tension over the supports, so lap them near midspan. Bottom bars are in tension at midspan, so lap them toward the supports.",
 dia:"splice",
 note:"In seismic frames: no laps inside the joint or within 2h of the column face, hoops at d/4 or 100 mm along every lap, and stagger laps where you can.", ref:"ACI 318 §18.6.3.3"},
{id:"rd-hooks", cat:"rebar", type:"concept", title:"Standard hooks",
 body:"A hook anchors a bar where there is no room for straight development. The straight tail after the bend is what grips the concrete.",
 rows:[["90° hook","12db tail"],["180° hook","4db tail, min 65 mm"],["Stirrup or tie, 135°","6db tail, min 75 mm"],["Seismic hoop","135°, 6db, min 75 mm"]],
 note:"Measure tails on the straight portion after the bend. Short tails are one of the most common rebar rejection items.", ref:"ACI 318 §25.3"},
{id:"rd-bend", cat:"rebar", type:"concept", title:"Minimum bend diameters",
 body:"Bending a bar too tightly cracks it on the outside of the bend and crushes concrete on the inside.",
 rows:[["10 – 25 mm bars","6db inside diameter"],["28 – 36 mm bars","8db"],["40 mm and larger","10db"],["Stirrups & ties ≤ 16 mm","4db"]],
 note:"Never heat bars to bend them, and never rebend a bar already embedded in concrete without the engineer's approval.", ref:"ACI 318 Table 25.3.1 · §26.6.3"},
{id:"rd-joint", cat:"rebar", type:"concept", title:"Hooks in a beam-column joint",
 body:"Beam bars ending at an exterior column are hooked. The hook tails must turn into the joint core: top bars bend down, bottom bars bend up.",
 dia:"joint",
 note:"A tail bent away from the joint anchors in cover concrete, which is the first thing to spall in an earthquake.", ref:"ACI 318 §18.8.5"},
{id:"rd-135", cat:"rebar", type:"number", big:"135°", unit:"seismic hook", title:"Why seismic hoops bend 135°",
 body:"A 90° hook sits in the cover. When cover spalls in strong shaking, the hook opens and the hoop stops confining the core. A 135° hook with a 6db tail locks into the core concrete.",
 note:"Minimum tail: 6db or 75 mm, whichever is larger. Check every hoop before closing the formwork.", ref:"ACI 318 §25.3.4"},
{id:"rd-couplers", cat:"rebar", type:"concept", title:"Mechanical couplers",
 body:"Couplers join bars end to end without a lap. They save steel and clear congestion in columns and heavy beams.",
 rows:[["Type 1","≥ 1.25 fy; keep out of hinge zones"],["Type 2","Full tensile strength; allowed anywhere"]],
 note:"Ask for test certificates for the exact coupler and bar grade. Thread engagement and torque are checked on site.", ref:"ACI 318 §18.2.7"},
{id:"rd-myth", cat:"rebar", type:"myth",
 myth:"Bar chairs are optional if the workers are careful.",
 fact:"Unsupported bars get stepped on and sag, which eats cover and effective depth. Chairs or concrete spacer blocks, typically about 1 m apart, are what hold the bars in place through the pour.", ref:"ACI 318 §26.6.2"},
{id:"rd-rust", cat:"rebar", type:"myth",
 myth:"Any rust on rebar means reject the delivery.",
 fact:"Light rust and mill scale are acceptable if a wire-brushed sample still meets the minimum size and weight. Reject loose, flaking rust and bars that have lost section.", ref:"ACI 318 §26.6.3"},
{id:"rd-q1", cat:"rebar", type:"quiz",
 q:"In a seismic frame beam, where must lap splices NOT be placed?",
 opts:["Within 2h of the column face","Middle third of the span (top bars)","Quarter-span zone (bottom bars)","Anywhere with hoops along the lap"], a:0,
 explain:"The 2h zone at each end is where plastic hinges form. Laps also stay out of the joint itself."},
{id:"rd-q2", cat:"rebar", type:"quiz",
 q:"Maximum spacing of temperature bars in a 100 mm slab:",
 opts:["450 mm","500 mm","300 mm","600 mm"], a:0,
 explain:"5h gives 500 mm, but the 450 mm cap governs."},
{id:"rd-q3", cat:"rebar", type:"quiz",
 q:"Concrete cover is measured to:",
 opts:["The outermost steel, usually the stirrup","The center of the main bar","The face of the main bar","The bar chair"], a:0,
 explain:"Stirrups and ties are closest to the surface, so cover is measured to them."},
{id:"bs-stirrups", cat:"beams", type:"concept", title:"Stirrup spacing",
 body:"Stirrups carry the shear that concrete cannot, so they crowd near supports where shear is highest and open up toward midspan.",
 rows:[["Normal shear","≤ d/2 and ≤ 600 mm"],["Heavy shear","≤ d/4 and ≤ 300 mm"],["Seismic, within 2h of support","≤ d/4, 6db, 150 mm"],["First hoop from column face","≤ 50 mm"]],
 note:"Heavy shear means Vs above 0.33√f'c·bw·d. On plans this shows up as two or three spacing zones per span.", ref:"ACI 318 §9.7.6 · §18.6.4"},
{id:"bs-oneway", cat:"beams", type:"concept", title:"One-way or two-way slab?",
 body:"A long, narrow panel bends mostly across its short direction. A panel closer to square bends both ways and needs main bars in both directions.",
 key:"Long ÷ short > 2 → one-way", legend:"Ratio of 2 or less → two-way",
 note:"A 3 × 7 m panel is one-way. A 4 × 5 m panel is two-way.", ref:"Slab design practice"},
{id:"bs-layers", cat:"beams", type:"concept", title:"Which bars go at the bottom?",
 body:"In a two-way slab the short span carries more moment. Its bars go in the outer layer, nearest the tension face, so they get the larger effective depth.",
 dia:"slab2",
 note:"The same logic applies to the top mat over supports: short-direction bars on the outside.", ref:"Detailing practice"},
{id:"bs-thick", cat:"beams", type:"concept", title:"Minimum depth without a deflection check",
 body:"One-way slabs and beams that meet these span-to-depth limits do not need deflection calculations. Thinner members do.",
 rows:[["Simply supported","Slab L/20 · Beam L/16"],["One end continuous","L/24 · L/18.5"],["Both ends continuous","L/28 · L/21"],["Cantilever","L/10 · L/8"]],
 note:"For Grade 60 steel and normal-weight concrete. A 4 m continuous one-way slab: 4000 ÷ 28 ≈ 143 mm.", ref:"ACI 318 Table 7.3.1.1 · 9.3.1.1"},
{id:"bs-topbars", cat:"beams", type:"concept", title:"How far top bars run",
 body:"Top bars over a support must cover the whole hogging zone and then anchor past the inflection point.",
 key:"≈ 0.3 Ln past the support face", legend:"Typical detail · beyond inflection by d, 12db or Ln/16",
 note:"Follow the cutoff marks on the plans. If none are shown, raise an RFI instead of guessing.", ref:"ACI 318 §9.7.3.8"},
{id:"bs-cantilever", cat:"beams", type:"concept", title:"Cantilevers and balconies",
 body:"A cantilever hangs on its top bars. Those bars must be anchored well back into the interior slab or beam, because the back span is what stops the cantilever from rotating off.",
 key:"Main bars on top, anchored ≥ ℓd behind the support",
 note:"Props stay under a cantilever until the concrete reaches design strength. Early stripping is the classic balcony failure.", ref:"Detailing practice"},
{id:"bs-cj", cat:"beams", type:"concept", title:"Where to stop a pour",
 body:"Construction joints go where shear is lowest. For slabs and beams, that is the middle third of the span.",
 rows:[["Slabs & beams","Middle third of span"],["Girders","Offset ≥ 2 × width of the beam framing in"],["Joint surface","Roughened, clean, damp, no standing water"]],
 note:"Never stop a pour at a support or a column face just because the truck ran out. Plan the joint before the pour.", ref:"ACI 318 §26.5.6"},
{id:"bs-sc1", cat:"beams", type:"scenario",
 sit:"Workers walked on the slab top bars all morning. The negative bars over the beams are now flattened onto the bottom mat.",
 do:["Stop the pour preparation for that area.","Lift the bars back to height and add chairs, typically about 1 m apart.","Lay walking boards over the top mat for the pour crew.","Recheck top cover and height before the concrete arrives."],
 why:"Top bars resist hogging over supports. In a 125 mm slab, pushing them down 25 mm cuts effective depth from about 100 to 75 mm, and the negative moment capacity drops by roughly a quarter or more.", ref:"Effective depth"},
{id:"bs-q1", cat:"beams", type:"quiz",
 q:"In a two-way slab, which bars go in the outer (bottom) layer?",
 opts:["Short-span bars","Long-span bars","Whichever is delivered first","Temperature bars"], a:0,
 explain:"The short span carries more moment, so its bars get the larger effective depth."},
{id:"bs-q2", cat:"beams", type:"quiz",
 q:"Max stirrup spacing for normal shear in a beam with d = 450 mm:",
 opts:["225 mm","450 mm","600 mm","112 mm"], a:0,
 explain:"d/2 = 225 mm, which is less than 600 mm."},
{id:"c-bars", cat:"columns", type:"concept", title:"Column bar rules",
 body:"Columns need enough steel to handle bending and creep, but not so much that concrete cannot get past the laps.",
 rows:[["Minimum bars","4 rectangular · 6 spiral"],["Steel ratio","1% – 8% · seismic 1% – 6%"],["Clear spacing","≥ 40 mm, 1.5db, 4/3 × aggregate"]],
 note:"At a lap the steel area doubles. Above about 4%, laps get congested and couplers start to make sense.", ref:"ACI 318 §10.6 · §10.7 · §18.7.4"},
{id:"c-ties", cat:"columns", type:"concept", title:"Column ties",
 body:"Ties stop vertical bars from buckling outward and hold the concrete core together.",
 rows:[["Spacing (ordinary)","≤ 16db, 48 × tie dia, least dimension"],["Tie size","10 mm for bars ≤ 32 mm, 12 mm above"],["Bar support","Every corner bar + alternate bars"],["Unsupported bar","≤ 150 mm clear from a tied bar"]],
 note:"300 mm column, 20 mm bars, 10 mm ties: 16 × 20 = 320, 48 × 10 = 480, least dimension 300. Use 300 mm or less.", ref:"ACI 318 §25.7.2"},
{id:"c-ends", cat:"columns", type:"concept", title:"Seismic column ends",
 body:"In an earthquake, column tops and bottoms are where hinges form. Those zones get tight hoops; the middle gets laps.",
 dia:"coltie",
 rows:[["End zone lo","Largest of h, clear height/6, 450 mm"],["Hoops in lo","≤ ¼ min dimension, 6db, 100 – 150 mm"],["First hoop","≤ half spacing from slab or footing"]],
 ref:"ACI 318 §18.7.5 · §25.7.2.4"},
{id:"c-splice", cat:"columns", type:"concept", title:"Where to splice column bars",
 body:"Older practice lapped column bars just above the slab. In special moment frames that is exactly where plastic hinges form, so laps go in the center half of the column height instead.",
 key:"Lap in the center half (seismic frames)", legend:"Tension lap splices, fully confined by hoops",
 note:"Ordinary frames may lap above the slab if the plans allow it. The plans and their seismic system decide.", ref:"ACI 318 §18.7.4.3"},
{id:"c-scwb", cat:"columns", type:"concept", title:"Strong column, weak beam",
 body:"If beams yield before columns, a building sways but stays up. If columns yield first, a whole floor can collapse onto the one below.",
 key:"ΣMnc ≥ 1.2 ΣMnb", legend:"Column strengths at a joint vs beam strengths",
 note:"Upsizing beams on site for extra safety can break this rule. Any change goes back to the engineer.", ref:"ACI 318 §18.7.3.2"},
{id:"c-sc1", cat:"columns", type:"scenario",
 sit:"A partial-height CHB wall has been built tight between two columns to form a window band.",
 do:["Flag it to the structural engineer.","Separate the wall from the columns with a gap and flexible filler, or have the columns checked for the shorter free length.","Look for the same condition at stair landings and mezzanines."],
 why:"The wall braces the lower part of the column, so its free length shrinks. A shorter column is much stiffer, attracts far more shear in an earthquake, and fails by a brittle diagonal crack. This is the short-column effect.", ref:"Seismic behavior"},
{id:"c-sc2", cat:"columns", type:"scenario",
 sit:"The rebar crew is lapping all column bars just above the second-floor slab, the way they did on houses before.",
 do:["Check the structural plans for the column splice detail.","In special moment frames, move laps to the center half of the column height.","Stagger laps or use couplers if the cage gets congested."],
 why:"The column end is a plastic hinge zone. A lap there can unzip once cover spalls, exactly when the column most needs its bars.", ref:"ACI 318 §18.7.4.3"},
{id:"c-myth", cat:"columns", type:"myth",
 myth:"The first column tie goes wherever it is convenient above the slab.",
 fact:"The bottom tie sits no more than half the tie spacing above the slab or footing, and ties continue through the beam-column joint. The ends of a column are where confinement matters most.", ref:"ACI 318 §25.7.2.4"},
{id:"c-q1", cat:"columns", type:"quiz",
 q:"Ordinary column, 300 × 300 mm, 20 mm bars, 10 mm ties. Max tie spacing?",
 opts:["300 mm","320 mm","480 mm","400 mm"], a:0,
 explain:"Least of 16 × 20 = 320, 48 × 10 = 480 and 300 mm."},
{id:"c-q2", cat:"columns", type:"quiz",
 q:"Seismic column, 400 mm deep, 3.0 m clear height. End zone length lo?",
 opts:["500 mm","400 mm","450 mm","600 mm"], a:0,
 explain:"Largest of h = 400, clear height ÷ 6 = 500, and 450 mm."},
{id:"f-anatomy", cat:"foundations", type:"concept", title:"Isolated footing anatomy",
 body:"Bottom bars sit on 75 mm cover above a lean concrete blinding. Column dowels go all the way down and hook so they rest on the bottom mat.",
 dia:"footing",
 note:"Blinding gives a clean, level base for the bar chairs and keeps mud out of the bottom mat.", ref:"ACI 318 §20.6 · §13.3"},
{id:"f-depth", cat:"foundations", type:"concept", title:"How deep is the footing?",
 body:"A footing must be deep enough for punching shear around the column and for the column dowels to develop.",
 key:"≥ 150 mm above bottom bars", legend:"Code minimum on soil; design depth usually governs",
 note:"If the dowel hooks will not fit in the depth shown, raise it before excavation, not at rebar inspection.", ref:"ACI 318 §13.3.1.2"},
{id:"f-sections", cat:"foundations", type:"concept", title:"Critical sections in a footing",
 body:"A footing is an upside-down slab: soil pushes up and the column holds it down. Each check happens at its own section.",
 rows:[["Bending","At the column face"],["One-way shear","At d from the column face"],["Punching shear","Perimeter at d/2 around the column"]],
 note:"Punching usually sets the depth of isolated footings.", ref:"ACI 318 §13.2.7 · §22.6"},
{id:"f-rect", cat:"foundations", type:"concept", title:"Bars in a rectangular footing",
 body:"Long-direction bars are spread evenly. Short-direction bars are concentrated in a central band as wide as the footing's short side.",
 key:"Band share = 2 / (β + 1)", legend:"β = long side ÷ short side",
 note:"A 2 × 3 m footing: β = 1.5, so 80% of the short-direction bars go in the central 2 m band.", ref:"ACI 318 §13.3.3.3"},
{id:"f-tie", cat:"foundations", type:"concept", title:"What tie beams do",
 body:"Tie beams connect isolated footings or column bases so they move together. They resist differential settlement and the sideways kick of columns in earthquakes.",
 note:"If a tie beam also carries a CHB wall, it is a grade beam and needs to be designed for that load.", ref:"Foundation practice"},
{id:"f-bearing", cat:"foundations", type:"concept", title:"Founding on the right soil",
 body:"The plans assume an allowable bearing pressure. Excavate until you reach soil that matches the report, and never found on fill, organic soil or ground softened by water.",
 note:"If the excavation bottom looks different from the soil report, stop and call the geotechnical engineer before pouring.", ref:"Geotechnical practice"},
{id:"f-sc1", cat:"foundations", type:"scenario",
 sit:"Overnight rain filled the footing excavations. The bottoms are now soft mud.",
 do:["Pump them out and remove the softened layer down to firm soil.","Fill any over-excavation with lean concrete, not loose soil.","Pour blinding as soon as each pit is cleaned."],
 why:"Softened soil compresses under load. One footing settling more than its neighbors is what cracks the walls and beams above it.", ref:"Foundation practice"},
{id:"f-q1", cat:"foundations", type:"quiz",
 q:"Punching shear in an isolated footing is checked at:",
 opts:["d/2 from the column face","d from the column face","The column face","The footing edge"], a:0,
 explain:"Punching uses a perimeter at d/2 around the column. One-way shear uses d."},
{id:"tr-how", cat:"trusses", type:"concept", title:"How a truss carries load",
 body:"A truss turns bending into pure push and pull. Loads applied at the joints split into axial forces: under gravity the top chord is squeezed and the bottom chord is stretched.",
 key:"Loads at panel points → axial forces only", dia:"fink",
 note:"Purlins belong on panel points. A purlin landing between joints bends the top chord, which it may not be designed for.", ref:"Statics"},
{id:"tr-pratt", cat:"trusses", type:"concept", title:"Pratt truss",
 body:"Under gravity, verticals are in compression and diagonals are in tension. The long members are the ones being pulled, which suits steel since slender members are efficient in tension.",
 dia:"pratt", note:"Common in steel bridges and low-pitch roofs. Patented by Thomas and Caleb Pratt in 1844.", ref:"Truss types"},
{id:"tr-howe", cat:"trusses", type:"concept", title:"Howe truss",
 body:"The reverse of the Pratt: diagonals in compression, verticals in tension. It suited timber diagonals with iron rods as the vertical ties.",
 dia:"howe", note:"Patented by William Howe in 1840 and widely used in timber railway bridges.", ref:"Truss types"},
{id:"tr-warren", cat:"trusses", type:"concept", title:"Warren truss",
 body:"Triangles with no verticals. Diagonals alternate between tension and compression, and having few member types makes fabrication simple.",
 dia:"warren", note:"Patented by James Warren and Willoughby Monzani in 1848. Verticals are sometimes added to shorten the top chord panels.", ref:"Truss types"},
{id:"tr-fink", cat:"trusses", type:"concept", title:"Fink truss",
 body:"Its W-shaped web keeps every member short, so light sections can span a pitched roof. It is the most common light steel and timber roof truss.",
 dia:"fink", note:"Named after Albert Fink, a German-American railroad engineer.", ref:"Truss types"},
{id:"tr-king", cat:"trusses", type:"concept", title:"King post truss",
 body:"One central post plus two struts. Simple and quick to build for short spans such as porches, garages and small houses.",
 dia:"king", note:"As spans grow, the unbraced rafter lengths get too long and builders move to queen post or Fink trusses.", ref:"Truss types"},
{id:"tr-queen", cat:"trusses", type:"concept", title:"Queen post truss",
 body:"Two vertical posts joined by a straining beam leave an open middle bay. It spans farther than a king post and can make room for an attic.",
 dia:"queen", note:"Also a classic short-span covered bridge form.", ref:"Truss types"},
{id:"tr-brace", cat:"trusses", type:"concept", title:"Bracing the roof",
 body:"Trusses standing side by side behave like dominoes. Cross bracing in the roof plane and along the bottom chord, plus sag rods between purlins, keeps them upright and stops chords from buckling sideways.",
 note:"Wind uplift reverses forces, so the bottom chord can go into compression. Bracing and strong hold-downs at the supports carry it.", ref:"Roof framing"},
{id:"tr-q1", cat:"trusses", type:"quiz",
 q:"In a Pratt truss under gravity load, the diagonals are in:",
 opts:["Tension","Compression","Bending","No force"], a:0,
 explain:"Pratt diagonals slope down toward midspan and are pulled. In a Howe truss they are pushed."},
{id:"tr-q2", cat:"trusses", type:"quiz",
 q:"Why should purlins sit on truss panel points?",
 opts:["To keep top chord members in axial load","For appearance","To shorten roof sheets","To reduce wind load"], a:0,
 explain:"A load between joints puts bending into the top chord, which a truss member may not be designed to resist."},
{id:"cn-time", cat:"concreting", type:"concept", title:"The ready-mix clock",
 body:"Concrete starts setting in the drum. The clock starts when water meets cement, and the batch ticket records that time.",
 key:"Discharge within 90 min or 300 drum revolutions",
 note:"Check the ticket time on every truck before it backs up to the pump.", ref:"ASTM C94"},
{id:"cn-vibe", cat:"concreting", type:"concept", title:"Vibrating concrete",
 body:"Vibration releases trapped air so concrete fills around the bars and against the forms. Too little leaves honeycomb; too much drives paste up and stone down.",
 rows:[["Insertion","Vertical; quick in, slow out"],["Into the layer below","About 150 mm"],["Per insertion","About 5 – 15 seconds"],["Layer depth","Typically 300 – 500 mm"]],
 note:"Never drag concrete sideways with the vibrator. Move it with shovels, then vibrate.", ref:"ACI 309R"},
{id:"cn-strip", cat:"concreting", type:"concept", title:"When the props can come off",
 body:"Side forms carry little load and come off early. Soffit props hold the weight of the concrete until it can carry itself.",
 rows:[["Beam & column sides","12 hours"],["Slab soffit, under 3 m · 3–6 m","4 · 7 days"],["Beam soffit, under 3 m · 3–6 m","7 · 14 days"],["Beam soffit, over 6 m","21 days"]],
 note:"Guide values for normal cement where live load is less than dead load. Strip earlier only with cylinder results and the engineer's approval, and reshore below fresh floors.", ref:"ACI 347 (guide values)"},
{id:"cn-cyl", cat:"concreting", type:"concept", title:"Sampling and passing cylinders",
 body:"Acceptance is statistical. One low test does not fail a pour, but a low running average does.",
 rows:[["Sample at least","Once a day, per 110 m³, per 460 m² of slab"],["One test","Average of 2 cylinders 150×300 (or 3 of 100×200)"],["Pass","Average of 3 consecutive tests ≥ f'c"],["And","No test below f'c − 3.5 MPa"]],
 note:"Above 35 MPa the individual limit becomes 0.90 f'c.", ref:"ACI 318 §26.12"},
{id:"cn-cure", cat:"concreting", type:"concept", title:"Curing is part of the pour",
 body:"Cement needs water to keep hydrating. Concrete that dries early stops gaining strength near the surface and cracks from plastic shrinkage.",
 key:"Keep moist at least 7 days", legend:"Ponding · wet burlap · curing compound · plastic sheeting",
 note:"A hot, windy afternoon can dry a slab surface within hours. Start curing as soon as the finish allows.", ref:"ACI 308R"},
{id:"cn-pipes", cat:"concreting", type:"concept", title:"Pipes and conduits in concrete",
 body:"Embedded pipes take away concrete the design counts on. Codes limit their size and spacing so the member keeps its strength.",
 rows:[["Size in slab, wall or beam","≤ ⅓ of member thickness"],["Spacing","≥ 3 diameters center to center"],["In columns","≤ 4% of the column area"]],
 note:"Run conduits between the top and bottom mats without displacing bars. Sleeves through beams need the engineer's approval.", ref:"ACI 318 §20.7"},
{id:"cn-hot", cat:"concreting", type:"concept", title:"Hot-weather concreting",
 body:"Heat speeds up setting and evaporation. The usual results are cold joints, lost slump and plastic shrinkage cracks.",
 rows:[["Schedule","Early morning or late afternoon"],["Before the pour","Dampen forms and subgrade"],["Placement temperature","Within the spec limit, often 32 – 35 °C"],["After finishing","Start curing immediately"]],
 ref:"ACI 305R"},
{id:"cn-water", cat:"concreting", type:"myth",
 myth:"A bit of water at the chute is fine if the slump is low.",
 fact:"Every extra liter raises the water–cement ratio and lowers strength. Use the approved admixture, add water only within the mix design's limit, or reject the load.", ref:"ASTM C94 · ACI 301"},
{id:"cn-drop", cat:"concreting", type:"myth",
 myth:"Free fall alone is what segregates concrete.",
 fact:"Segregation comes mostly from concrete hitting bars and form walls on the way down. Use a tremie or drop chute in tall columns and walls, and follow the project spec's drop limit.", ref:"ACI 304R"},
{id:"cn-sc1", cat:"concreting", type:"scenario",
 sit:"A truck shows up two hours after batching. The driver offers to add water to bring the slump back.",
 do:["Check the batch ticket time.","Past 90 minutes, reject the load unless the spec allows otherwise.","Never let water push it beyond the mix design's water–cement ratio.","Note the truck number and time in the pour log."],
 why:"Retempering old concrete with water gives you a weaker, more permeable mix that still looks fine coming down the chute.", ref:"ASTM C94"},
{id:"cn-sc2", cat:"concreting", type:"scenario",
 sit:"Stripping the column forms reveals honeycomb at the base, deep enough to see the ties.",
 do:["Photograph and measure it before anyone patches it.","Report it to the structural engineer.","Typical repair: chip to sound concrete, clean, bonding agent, non-shrink repair mortar.","Large or deep voids may need injection, jacketing or core tests."],
 why:"Honeycomb at a column base weakens the most heavily loaded section and leaves bars exposed to corrosion. Cosmetic plastering hides it without fixing it.", ref:"ACI 546R"},
{id:"cn-sc3", cat:"concreting", type:"scenario",
 sit:"A 28-day result comes back at 18.5 MPa on a 21 MPa specification.",
 do:["Compare it with the individual limit: 21 − 3.5 = 17.5 MPa, so it passes that check.","Check the running average of three consecutive tests.","If the average is below f'c, investigate and consider cores."],
 why:"Core acceptance: average of three cores at least 0.85 f'c and no single core below 0.75 f'c. One low cylinder is a flag, not a failure.", ref:"ACI 318 §26.12.4"},
{id:"cn-q1", cat:"concreting", type:"quiz",
 q:"f'c = 21 MPa. What is the lowest acceptable individual strength test?",
 opts:["17.5 MPa","21.0 MPa","18.9 MPa","14.0 MPa"], a:0,
 explain:"For f'c up to 35 MPa, no test may fall below f'c − 3.5 MPa."},
{id:"cn-q2", cat:"concreting", type:"quiz",
 q:"Where should a construction joint in a beam be placed?",
 opts:["Middle third of the span","At the column face","At a quarter of the span","Wherever the pour ends"], a:0,
 explain:"Shear is lowest near midspan, so the joint does the least harm there."},
{id:"sw-grout", cat:"steel", type:"concept", title:"Grouting under base plates",
 body:"Steel columns are set on leveling nuts or shims. The gap under the base plate is then filled with non-shrink grout so load bears evenly on the pedestal.",
 key:"Grout gap typically 25 – 50 mm",
 note:"Pour from one side only so air escapes from the other. Grout poured from all sides traps voids.", ref:"AISC Design Guide 1"},
{id:"sw-bolts", cat:"steel", type:"concept", title:"Setting anchor bolts",
 body:"Anchor bolts are cast in using a template that holds their position and projection. Once the concrete sets, there is no adjusting them.",
 note:"Survey the bolts before the pour and again after. A 10 mm error here becomes a fit-up fight later.", ref:"Erection practice"},
{id:"sw-tighten", cat:"steel", type:"concept", title:"Snug-tight or pretensioned?",
 body:"Most bearing bolted connections only need snug-tight: the full effort of a worker with a spud wrench. Slip-critical and some seismic connections need pretension.",
 rows:[["Turn-of-nut, length ≤ 4d","⅓ turn past snug"],["Length 4d – 8d","½ turn"],["Length 8d – 12d","⅔ turn"]],
 note:"Match-mark the nut and bolt end before turning so the rotation can be checked afterward.", ref:"RCSC Specification"},
{id:"sw-weld", cat:"steel", type:"concept", title:"Inspecting welds by eye",
 body:"Visual inspection catches most problems early: cracks, undercut, porosity, and undersized or missing welds.",
 note:"Check fillet size with a gauge. A specified 6 mm fillet that measures 4 mm has about two-thirds of its design strength.", ref:"AWS D1.1"},
{id:"sw-q1", cat:"steel", type:"quiz",
 q:"Turn-of-nut rotation past snug for a bolt length up to 4 diameters:",
 opts:["⅓ turn","½ turn","⅔ turn","1 full turn"], a:0,
 explain:"⅓ turn for lengths up to 4d, ½ for 4d–8d, ⅔ for 8d–12d."},
{id:"ss-heights", cat:"safety", type:"concept", title:"Three heights to remember",
 body:"Different hazards have different trigger heights. Know which one applies to the work in front of you.",
 rows:[["Fall protection, general construction","1.8 m (6 ft)"],["Scaffolds","3.0 m (10 ft)"],["Excavation protective system","1.5 m (5 ft)"]],
 ref:"OSHA 1926.501 · .451 · .652"},
{id:"ss-ladder", cat:"safety", type:"concept", title:"The 4-to-1 ladder rule",
 body:"Set an extension ladder's base one unit out from the wall for every four units of height to its top support.",
 key:"Base offset = H / 4", legend:"Extend at least 0.9 m (3 ft) above the landing",
 note:"That sets the ladder at about 75° to the ground.", ref:"OSHA 1926.1053"},
{id:"ss-forms", cat:"safety", type:"concept", title:"Formwork warning signs",
 body:"Most formwork failures happen during the pour. Watch for bulging forms, props kicking out, wedges loosening and sudden sag.",
 note:"Assign one person to watch the props under the slab during the pour, with authority to stop it.", ref:"ACI 347"},
{id:"ss-caps", cat:"safety", type:"concept", title:"Protruding rebar",
 body:"Exposed vertical bars are an impalement hazard. Cap them, bend them over, or cover them with a protective trough.",
 note:"Small mushroom caps only protect against scrapes. Where someone could fall onto bars, use caps rated for impalement.", ref:"OSHA 1926.701(b)"},
{id:"ss-sc1", cat:"safety", type:"scenario",
 sit:"The footing excavation is 1.8 m deep in loose soil, and two workers are inside setting forms.",
 do:["Get them out.","Slope, bench or shore the sides before re-entry.","Keep spoil and materials at least 0.6 m back from the edge.","Provide a ladder within 7.6 m of travel for trenches 1.2 m or deeper."],
 why:"Protective systems are required from 1.5 m unless the excavation is in stable rock. A cubic meter of soil weighs over a tonne, and walls collapse without warning.", ref:"OSHA 1926.651 · .652"},
{id:"ss-q1", cat:"safety", type:"quiz",
 q:"At what depth does an excavation need a protective system (unless stable rock)?",
 opts:["1.5 m (5 ft)","1.2 m (4 ft)","1.8 m (6 ft)","3.0 m (10 ft)"], a:0,
 explain:"1.2 m is the trigger for providing a ladder. 1.5 m is the protective system trigger."},
{id:"e-classA", cat:"estimating", type:"number", big:"1:2:4", unit:"Class A", title:"Class A concrete per cubic meter",
 body:"Using 40 kg bags, a Class A mix takes about 9 bags of cement, 0.50 m³ of sand and 1.00 m³ of gravel per cubic meter of concrete.",
 note:"Class AA 1:1.5:3 → 12 bags · Class B 1:2.5:5 → 7.5 bags · Class C 1:3:6 → 6 bags.", ref:"PH estimating practice (verify against your mix design)"},
{id:"e-chb", cat:"estimating", type:"concept", title:"CHB per square meter",
 body:"Standard 10 × 20 × 40 cm hollow blocks with mortar joints take 12.5 pieces per square meter of wall.",
 key:"12.5 pcs / m²", legend:"Net wall area × 12.5 = number of blocks",
 note:"Deduct door and window openings first, then add an allowance for breakage.", ref:"PH estimating practice"},
{id:"e-weight", cat:"estimating", type:"concept", title:"Rebar weight in your head",
 body:"Steel weighs 7,850 kg/m³. Square the bar diameter in millimeters and divide by 162 to get kilograms per meter.",
 key:"kg/m = d² / 162", legend:"10 mm → 0.62 · 12 → 0.89 · 16 → 1.58 · 20 → 2.47",
 note:"A 6 m length of 16 mm bar weighs about 9.5 kg. Handy for checking deliveries.", ref:"7,850 kg/m³ × πd²/4"},
{id:"e-laps", cat:"estimating", type:"concept", title:"Laps, hooks and cutting waste",
 body:"Plan lengths ignore laps and hooks unless you add them. Count laps per bar run, hooks per bar end, then plan cutting lists around the stock lengths you can buy.",
 rows:[["Common stock lengths","6, 7.5, 9, 10.5, 12 m"],["Laps","Add one lap per joint in each continuous run"],["Hooks","Add the hook tail per hooked end"]],
 note:"A good cutting list that uses offcuts for dowels and short bars can save more than any price negotiation.", ref:"Takeoff practice"},
{id:"e-swell", cat:"estimating", type:"concept", title:"Bank, loose and compacted",
 body:"Excavated soil takes up more space once dug and less once compacted. Hauling and fill are measured in different volumes.",
 key:"Loose = Bank × (1 + swell)", legend:"Common earth ≈ 25% swell · blasted rock up to 50 – 60%",
 note:"Price trucks on loose volume and pay for embankment on compacted volume.", ref:"Earthwork estimating"},
{id:"hx-hammurabi", cat:"history", type:"history", year:"c.1754 BC", place:"Babylon", title:"The first building code",
 body:"The Code of Hammurabi held builders responsible for their work. If a house collapsed and killed its owner, the builder was put to death.",
 note:"Accountability for structural safety is as old as written law.", ref:"Code of Hammurabi"},
{id:"hx-pantheon", cat:"history", type:"history", year:"c.126", place:"Rome", title:"The Pantheon dome",
 body:"Its 43.3 m dome is still the largest unreinforced concrete dome in the world. The Romans graded the aggregate, using light pumice near the top and heavier stone toward the base.",
 note:"Cutting self-weight where it matters most is still how long spans are designed.", ref:"Roman engineering"},
{id:"hx-gard", cat:"history", type:"history", year:"1st c.", place:"Nîmes, France", title:"Pont du Gard",
 body:"Part of an aqueduct that carried water about 50 km to Nîmes with a total drop of only about 12.6 m, set out without modern surveying instruments.",
 note:"Gradient control is still the core skill in drainage and sewer work.", ref:"Roman engineering"},
{id:"hx-iron", cat:"history", type:"history", year:"1779", place:"Shropshire, England", title:"The Iron Bridge",
 body:"The first major bridge built of cast iron. Its parts were joined with carpentry joints such as dovetails and mortise-and-tenon, because that was the joinery its builders knew.",
 note:"New materials are first built like the old ones.", ref:"Industrial Revolution"},
{id:"hx-monier", cat:"history", type:"history", year:"1867", place:"Paris", title:"Reinforced concrete flowerpots",
 body:"Gardener Joseph Monier patented iron-reinforced concrete flowerpots. He later extended his patents to pipes, tanks and bridges.",
 note:"Reinforced concrete started as a fix for cracking garden pots.", ref:"History of concrete"},
{id:"hx-brooklyn", cat:"history", type:"history", year:"1883", place:"New York", title:"Brooklyn Bridge",
 body:"Chief engineer Washington Roebling was disabled by caisson disease during construction. His wife, Emily Warren Roebling, carried his instructions to the site and managed much of the work for over a decade.",
 note:"The bends that struck caisson workers shaped how compressed-air work is regulated today.", ref:"Bridge history"},
{id:"hx-eiffel", cat:"history", type:"history", year:"1889", place:"Paris", title:"Eiffel Tower",
 body:"About 18,000 wrought-iron parts and 2.5 million rivets, assembled in just over two years. Every part was drawn and pre-drilled before it reached the site.",
 note:"Prefabrication and detailed shop drawings made the schedule possible.", ref:"Structural history"},
{id:"hx-hoover", cat:"history", type:"history", year:"1936", place:"Nevada–Arizona", title:"Cooling Hoover Dam",
 body:"The dam was poured in blocks laced with pipes that carried chilled water. As a single mass, the concrete would have taken over a century to cool and would have cracked as it did.",
 note:"Heat of hydration is why mass concrete pours have their own temperature specifications.", ref:"Mass concrete"},
{id:"hx-tacoma", cat:"history", type:"history", year:"1940", place:"Washington, USA", title:"Tacoma Narrows",
 body:"Opened in July and collapsed on November 7, 1940, in a wind of about 65 km/h. Its shallow, flexible deck twisted itself apart through aeroelastic flutter.",
 note:"Every long-span bridge since has been wind-tunnel tested.", ref:"Bridge failures"},
{id:"hx-sanjuanico", cat:"history", type:"history", year:"1973", place:"Samar–Leyte", title:"San Juanico Bridge",
 body:"About 2.16 km long, crossing the San Juanico Strait between Samar and Leyte. For nearly five decades it was the longest bridge in the Philippines, until the Cebu–Cordova Link Expressway opened in 2022.",
 note:"It has stood through decades of typhoons over open seawater.", ref:"Philippine infrastructure"},
{id:"hx-hyatt", cat:"history", type:"history", year:"1981", place:"Kansas City", title:"Hyatt Regency walkways",
 body:"A hanger detail was changed from one continuous rod to two rods. That doubled the load on the fourth-floor box beam connection, which pulled through and killed 114 people.",
 note:"A shop drawing change is a design change. Route it back to the engineer of record.", ref:"Structural failures"},
{id:"hx-pisa", cat:"history", type:"history", year:"2001", place:"Pisa", title:"Saving the Leaning Tower",
 body:"Engineers drilled out small amounts of soil from under the north side. The tower settled back by about 45 cm, enough to keep it standing for centuries.",
 note:"Soft clay caused the lean in the first place, starting in the 1100s.", ref:"Geotechnical history"},
{id:"hx-millennium", cat:"history", type:"history", year:"2000", place:"London", title:"The wobbly bridge",
 body:"The Millennium Bridge closed two days after opening. People walking fell into step with its slight sideways sway and amplified it. Added dampers fixed it.",
 note:"Footbridges are now checked for lateral, not just vertical, footfall vibration.", ref:"Bridge dynamics"},
{id:"hx-q1", cat:"history", type:"quiz",
 q:"What doubled the load on the Hyatt Regency walkway connection?",
 opts:["Splitting one continuous hanger rod into two","Overcrowding on opening day","Poor concrete strength","Wind vibration"], a:0,
 explain:"The two-rod detail made the upper box beam carry both walkways through a single connection."}
    ]
  }
};
