const PACKS = [
  {id:"failures", name:"Failure Files", price:250, desc:"7 cards on collapses that rewrote the codes, from Quebec 1907 to Surfside 2021, including Manila's Ruby Tower.",
   cat:{id:"failures", label:"Failure Files", code:"FF"},
   cards:[
    {id:"ff-quebec", type:"history", year:"1907", place:"Québec, Canada", title:"The Quebec Bridge",
     body:"During construction, the south cantilever arm buckled at a compression chord and fell into the St. Lawrence River, killing 75 workers. The span had been lengthened without the dead load being recalculated, and warnings about bending chords were not acted on in time.",
     note:"A widely told story says the Canadian engineer's iron ring was made from the bridge's steel. That is a legend, but the ring's reminder of duty is real.", ref:"Bridge failures"},
    {id:"ff-ruby", type:"history", year:"1968", place:"Binondo, Manila", title:"Ruby Tower",
     body:"The six-storey Ruby Tower collapsed in the Casiguran earthquake of August 2, 1968, killing more than 260 people. Investigations pointed to poor design and construction quality.",
     note:"It was a turning point for Philippine structural practice. ASEP published the first National Structural Code a few years later, in 1972.", ref:"Philippine engineering history"},
    {id:"ff-ronan", type:"history", year:"1968", place:"London", title:"Ronan Point",
     body:"A gas explosion on the 18th floor blew out a load-bearing precast wall panel. With nothing tying the panels together, the floors above and below fell in turn and one corner of the tower came down.",
     note:"Ronan Point gave us robustness rules: tie the structure together so the loss of one element cannot bring down the rest.", ref:"Progressive collapse"},
    {id:"ff-sampoong", type:"history", year:"1995", place:"Seoul", title:"Sampoong Department Store",
     body:"Columns were thinned and removed to fit escalators, a floor was added, and heavy rooftop chillers were dragged across the roof. The flat slabs punched through around the columns and the store collapsed in seconds, killing 502 people.",
     note:"Cracks had appeared for weeks before. Flat-slab punching gives almost no warning at the end.", ref:"Structural failures"},
    {id:"ff-rana", type:"history", year:"2013", place:"Savar, Bangladesh", title:"Rana Plaza",
     body:"Floors had been added without a permit, and heavy generators and machinery ran on the upper levels. Cracks were reported the day before, but workers were sent back in. The collapse killed more than 1,100 people.",
     note:"When a building shows structural cracks, the engineer's job is to stop occupancy until it is assessed.", ref:"Structural failures"},
    {id:"ff-champlain", type:"history", year:"2021", place:"Surfside, Florida", title:"Champlain Towers South",
     body:"Part of the 12-storey condominium collapsed at night, killing 98 people. A 2018 engineering report had flagged major damage to the concrete under the pool deck, linked to water that could not drain.",
     note:"An inspection report only helps if the repairs it calls for are done.", ref:"Structural failures"},
    {id:"ff-q1", type:"quiz",
     q:"Which change did NOT contribute to the Sampoong collapse?",
     opts:["Switching to a steel-frame structure","Thinning and removing columns","Adding an extra floor","Moving heavy chillers on the roof"], a:0,
     explain:"Sampoong was a reinforced concrete flat-slab building. Lost column capacity plus added loads led to punching failure."}
   ]},
  {id:"plumbing", name:"Plumbing Rough-in", price:250, desc:"7 cards from the Master Plumber's side of the site: traps, vents, fall, testing and fixture rough-ins.",
   cat:{id:"plumbing", label:"Plumbing", code:"PL"},
   cards:[
    {id:"pl-trap", type:"concept", title:"Trap seals",
     body:"A trap holds a plug of water that stops sewer gas from coming back into the room. Every fixture needs one.",
     rows:[["Trap seal depth","50 – 100 mm (2 – 4 in)"],["One trap per fixture","Up to 3 adjacent sink compartments may share one"],["Double trapping","Not allowed"]],
     note:"Floor drains that rarely get water lose their seal by evaporation. Fit a trap primer or set a refill routine.", ref:"National Plumbing Code (UPC basis)"},
    {id:"pl-slope", type:"concept", title:"Fall on horizontal drains",
     body:"Horizontal drainage pipes need a steady fall so water carries solids along. Low spots and reverse grades are where blockages start.",
     key:"2%  (¼ in per foot)", legend:"Pipes 100 mm and larger may drop to 1% where 2% is impractical",
     note:"Check fall with a level and a story pole before any backfill or slab pour covers the pipe.", ref:"National Plumbing Code (UPC basis)"},
    {id:"pl-vent", type:"concept", title:"Why every trap needs a vent",
     body:"Without a vent, water rushing down a drain can siphon the trap dry. Vents let air in to protect the seal and let sewer gas out above the roof.",
     rows:[["Vent terminal","≥ 150 mm above the roof"],["Near openings","≥ 3 m away from or ≥ 0.9 m above any window, door or air intake"]],
     note:"Gurgling fixtures and slow drains after a nearby flush usually mean a missing or blocked vent.", ref:"National Plumbing Code (UPC basis)"},
    {id:"pl-test", type:"concept", title:"Test before you cover it",
     body:"No drain, waste, vent or water line gets buried, boxed in or poured over until it has been tested and inspected.",
     rows:[["DWV water test","3 m head over the section, 15 min, no leaks"],["DWV air test","35 kPa (5 psi), 15 min"],["Water supply","Working pressure + 50%, 15 min (or 345 kPa / 50 psi air)"]],
     note:"Record the test with date, pressure and witness. It is your evidence if a leak shows up later.", ref:"Revised National Plumbing Code (1999)"},
    {id:"pl-wc", type:"concept", title:"Water closet rough-in",
     body:"Set the floor flange before the slab or tiles go in. Getting it wrong means breaking the floor later.",
     rows:[["Center to finished back wall","300 mm (12 in) standard rough-in"],["Center to side wall","≥ 380 mm (15 in)"],["Clear space in front","≥ 600 mm (24 in)"]],
     note:"Measure from the finished wall, not the bare CHB. Tile and plaster thickness eat into the rough-in.", ref:"National Plumbing Code (UPC basis)"},
    {id:"pl-sc1", type:"scenario",
     sit:"The kitchen sink line is about to be tied into the storm drain because it is closer than the sanitary line.",
     do:["Stop the connection.","Route kitchen waste to the sanitary line through a grease trap where required.","Keep storm and sanitary systems separate all the way to the outfall."],
     why:"Storm drains often discharge untreated to canals and creeks. Mixing them breaks the Plumbing Code and the Sanitation Code (PD 856), and kitchen grease clogs the storm line.", ref:"PD 856 · National Plumbing Code"},
    {id:"pl-myth", type:"myth",
     myth:"PVC solvent cement sets in seconds, so you can pressure-test right away.",
     fact:"The joint grabs quickly but needs time to cure. Cure time depends on pipe size, temperature and humidity. Follow the cement maker's cure chart before testing.", ref:"Solvent welding practice"}
   ]}
];
PACKS.forEach(p=>p.cards.forEach(c=>{c.cat=p.cat.id;c.pack=p.id;}));

/* ---------- Deep dives (long reads) ---------- */
const DIVES = [
 {id:"dv-notes", cat:"behavior", title:"Reading the general notes on a structural plan",
  sum:"The one sheet that sets the rules for every other sheet, and what to pull from it.",
  rel:["rd-cover","rd-lap","rd-splice"],
  secs:[
   {h:"Start with the notes", p:["The general notes sheet sets the rules every other structural sheet assumes. The drawings tell you where things go; the notes tell you what grade, what strength and what cover. Reading it first stops you from approving a cage that matches the drawing but not the spec.","It is usually the first structural sheet. If the plans have none, ask for one before construction starts. Missing notes mean someone on site will be guessing."]},
   {h:"What you will find", p:["Design codes and their editions, such as NSCP 2015 and ACI 318. Concrete strength for each element: footings, columns, beams and slabs can each have a different f'c. The reinforcing bar grade, sometimes one grade for small bars and another for main bars.","A cover table, a lap and development schedule, the soil bearing capacity the footings were designed for, and the design loads, including the wind and seismic parameters. Construction notes cover stripping times, construction joints, embedded items and openings."]},
   {h:"When notes and drawings disagree", p:["Contracts usually state an order of precedence between specifications, drawings and details. Common wording says written dimensions govern over scaled ones and large-scale details govern over small-scale views.","Where the conflict is real and no rule settles it, do not pick one on site. Write an RFI, get the engineer of record's answer in writing, and file it with the plans."]},
   {h:"Lines that are easy to miss", p:["\"Top bars shall be spliced at midspan.\" \"Dowels shall match column bars in size and number.\" \"No openings in beams without the engineer's approval.\" \"Provide additional bars around slab openings.\" \"All dimensions in millimeters unless noted.\"","Each of these settles an argument before it starts. Highlight them on the site set."]},
   {h:"Make a one-page site card", p:["Copy the f'c values, bar grade, cover table and lap schedule onto one page and post it in the site office and at the bar-bending yard. The foreman should not need to open the full plan set to check a lap length."]}
  ]},
 {id:"dv-pour", cat:"concreting", title:"The life of a slab pour",
  sum:"From the pre-pour check to stripping the props, step by step.",
  rel:["cn-time","cn-vibe","cn-cyl","cn-strip","bs-sc1"],
  secs:[
   {h:"The day before", p:["Formwork: check levels, prop spacing, bracing and ties, and any camber the plans call for. Rebar: check sizes, spacing, laps, chairs, cover blocks and the height of the top mat. Embedded items: conduits, sleeves, inserts and box-outs, all fixed so they cannot float.","Clean out sawdust, tie wire and debris, then wet the forms just before the pour so they do not draw water from the concrete."]},
   {h:"Pour day", p:["Check the weather. Confirm crew, tools and a standby vibrator. Agree the pour sequence and where a construction joint goes if the pour has to stop: in the middle third of the span.","For every truck, read the batch ticket time and mix before discharge. Run slump tests at the frequency the specs require and cast cylinders. Keep one person under the slab watching the props, with authority to stop the pour."]},
   {h:"Placing and finishing", p:["Place concrete close to its final position instead of dragging it. Vibrate each layer, screed to level, then float. Do not sprinkle water or dust cement on the surface to make finishing easier. It leaves a weak, dusty top layer."]},
   {h:"Curing", p:["Start curing as soon as the surface can take it without marking. Keep it moist for at least 7 days, by ponding, wet burlap, curing compound or plastic sheeting. Hot, windy afternoons dry slabs faster than most people expect."]},
   {h:"Stripping and reshoring", p:["Side forms can come off early. Soffit props stay until the concrete can carry itself, following the stripping schedule or cylinder results approved by the engineer. Reshore under fresh floors when the floor above is being cast.","A common mistake is stacking CHB and sand bags on a slab that is only a few days old. Construction loads on young slabs belong in the plan, not wherever the truck dumps them."]}
  ]},
 {id:"dv-seismic", cat:"columns", title:"Why seismic detailing rules exist",
  sum:"Ductility, plastic hinges and confinement: the reason behind every tight hoop and 135° hook.",
  rel:["c-ends","c-scwb","rd-135","rd-joint","c-sc1"],
  secs:[
   {h:"Designed to bend, not to stay elastic", p:["Code earthquake forces are reduced by a response modification factor, R, on the assumption that the structure can yield and deform many times without collapsing. Detailing is what makes that assumption true. Without it the reduced design forces are simply unsafe."]},
   {h:"Plastic hinges", p:["In a well-behaved frame, beams yield at their ends next to the columns. Those zones crack, spall and rotate. That is why the 2h zone at each beam end gets closely spaced hoops and no lap splices: it is the part of the beam that will be damaged on purpose."]},
   {h:"Strong column, weak beam", p:["Columns at a joint must be stronger in bending than the beams framing into them. If the columns hinge instead, one storey can sway sideways until it pancakes. Upsizing beams on site can quietly break this rule."]},
   {h:"Confinement", p:["Closely spaced hoops hold the core concrete together after the cover spalls, and stop the vertical bars from buckling outward. Hooks bend 135° with 6db tails so they anchor in the core and do not pop open when the cover is gone.","Ties continue through the beam-column joint. The joint is the most congested spot in the frame and the most tempting place to skip ties. Do not skip them."]},
   {h:"The Philippine context", p:["Under NSCP 2015 most of the country is in Seismic Zone 4 (Z = 0.40). Zone 2 (Z = 0.20) covers Palawan except Busuanga, plus Sulu and Tawi-Tawi. The 1990 Luzon earthquake, the 2013 Bohol earthquake and the 2019 Cotabato sequence all showed what weak detailing does.","On most Philippine sites, seismic detailing is not optional fine print. It is the main reason the frame survives."]}
  ]},
 {id:"dv-truss", cat:"trusses", title:"Choosing a roof truss",
  sum:"Span, pitch, material and typhoon uplift: how to pick and check a roof system.",
  rel:["tr-how","tr-fink","tr-brace","tr-q2"],
  secs:[
   {h:"Start from span and pitch", p:["King post trusses suit short spans like porches and garages. Fink trusses are the usual choice for houses because the W web keeps members short. Howe and Pratt forms suit longer, flatter roofs. Warren trusses with parallel chords suit flat roofs and long industrial spans."]},
   {h:"Material", p:["Timber needs protection from termites and moisture. Cold-formed steel, in C sections or tubes, is light and fast but depends on correct screws and connection design. Hot-rolled angles are heavier and usually welded. Welds on galvanized members need zinc-rich paint touch-up afterward."]},
   {h:"Purlins and roofing", p:["Purlin spacing comes from the roofing sheet's allowable span and the wind load. Place purlins on panel points so the top chord stays in axial load. If purlins must land between joints, the top chord has to be checked for bending."]},
   {h:"Typhoon uplift", p:["In the Philippines, wind uplift often governs the connections, not gravity. Edges, corners and ridges see the highest suction. Each truss needs designed hold-down anchors or straps into the beam or wall plate. Check the NSCP wind zone for the site; eastern seaboard provinces face some of the highest design wind speeds.","Many roofs that blow off fail at the connection: a few nails or one undersized bolt holding a truss that the wind is lifting."]},
   {h:"Site mistakes to catch", p:["Chords cut to pass ducts. Missing bolts or screws at heel joints. Purlins between nodes. No bottom-chord ties or bracing. Each one can turn a correctly designed truss into a weak one."]}
  ]},
 {id:"dv-splice", cat:"rebar", title:"Splices and development, the full picture",
  sum:"Why lap lengths change, Class A vs Class B, compression laps, couplers and where to splice.",
  rel:["rd-lap","rd-splice","rd-couplers","c-splice"],
  secs:[
   {h:"The idea of development length", p:["A bar can only reach its yield strength if enough length is embedded in concrete to transfer that force through bond. That length is the development length, ℓd. A lap splice works by overlapping two bars long enough for force to pass from one to the other through the concrete between them."]},
   {h:"What makes it longer or shorter", p:["Top bars with more than 300 mm of fresh concrete below them get a 1.3 factor because bleed water weakens the bond under them. Epoxy coating, larger bars and lower concrete strength lengthen ℓd. More cover, wider spacing and confining stirrups shorten it."]},
   {h:"Class A or Class B", p:["A Class A tension lap is 1.0 ℓd. It is allowed only where the steel provided is at least twice what is required over the whole lap and no more than half the bars are spliced there. Everything else is Class B, at 1.3 ℓd. Most site lap schedules use Class B."]},
   {h:"Compression laps", p:["Column bars mainly in compression can use compression laps: for Grade 60 bars, about 30 bar diameters and never under 300 mm. In seismic frames, column laps are designed as tension laps anyway, because the columns reverse load in an earthquake."]},
   {h:"Alternatives to laps", p:["Mechanical couplers save steel and clear congestion; use Type 2 couplers in hinge zones. Welded splices need a weldable bar grade and a qualified procedure under AWS D1.4. Never tack-weld crossing bars of ordinary rebar to hold a cage together. The heat makes the bar brittle at that spot."]},
   {h:"Where to splice, in summary", p:["Beams: top bars near midspan, bottom bars toward the supports, never within 2h of the column face in seismic frames. Columns: center half of the height in special moment frames. Slabs: away from maximum moment, staggered where the plans ask for it."]}
  ]},
 {id:"dv-fail", cat:"history", title:"Five collapses every engineer should know",
  sum:"What Quebec, Ronan Point, Hyatt Regency, Sampoong and Surfside changed.",
  rel:["hx-hyatt","hx-tacoma"],
  secs:[
   {h:"Quebec Bridge, 1907", p:["The span was lengthened but the dead load was never recalculated. Compression chords were seen bending and the warnings did not reach the right people in time. Lesson: when the design changes, the calculations change with it, and field warnings need a fast route to the designer."]},
   {h:"Ronan Point, 1968", p:["A gas explosion removed one wall panel and a whole corner fell. Lesson: robustness. Tie structures together so losing one element does not bring down the rest."]},
   {h:"Hyatt Regency, 1981", p:["A hanger detail changed from one continuous rod to two in the shop drawings, doubling the load on one connection. Lesson: a shop drawing change is a design change and must go back to the engineer of record."]},
   {h:"Sampoong, 1995", p:["Columns thinned and removed, a floor added and heavy roof chillers moved. The flat slabs punched through. Lesson: renovations and change of use need structural review, and flat-slab punching gives almost no warning at the end."]},
   {h:"Champlain Towers South, 2021", p:["Years of water damage under a pool deck, flagged in a 2018 report, were not repaired in time. Lesson: maintenance is part of structural safety, and inspection findings have deadlines."]}
  ]}
];

const svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${inner}</svg>`;
function udlArrows(x1,x2,y1,y2,n){
  let s=`<line class="a" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y1}"/>`;
  for(let i=0;i<=n;i++){const x=+(x1+(x2-x1)*i/n).toFixed(1);
    s+=`<line class="a" x1="${x}" y1="${y1}" x2="${x}" y2="${y2-5}"/><path class="af" d="M${x-3.5} ${y2-6}L${x} ${y2}L${x+3.5} ${y2-6}Z"/>`;}
  return s;
}
const pin=(x,y)=>`<path class="l" d="M${x} ${y}l-8 12h16z"/>`;
function truss(type){
  const L=20,R=280,B=86,P=18,mid=150,segs=[],nodes=[];
  const S=(a,b,c)=>segs.push([a,b,c||"l"]);
  const ry=x=>x<=mid?B-(B-P)*(x-L)/(mid-L):B-(B-P)*(R-x)/(R-mid);
  if(type==="pratt"||type==="howe"||type==="warren"){
    const T=34,n=6,xs=[...Array(n+1)].map((_,i)=>L+(R-L)*i/n);
    if(type==="warren"){
      const tops=[];for(let i=0;i<n;i++)tops.push([(xs[i]+xs[i+1])/2,T]);
      S([L,B],[R,B]);S(tops[0],tops[n-1]);
      for(let i=0;i<n;i++){const left=i<n/2;S([xs[i],B],tops[i],left?"l":"a");S(tops[i],[xs[i+1],B],left?"a":"l");}
      xs.forEach(x=>nodes.push([x,B]));tops.forEach(t=>nodes.push(t));
    }else{
      S([L,B],[R,B]);S([xs[1],T],[xs[n-1],T]);S([L,B],[xs[1],T]);S([xs[n-1],T],[R,B]);
      for(let i=1;i<n;i++)S([xs[i],T],[xs[i],B],type==="howe"?"a":"l");
      for(let i=1;i<n-1;i++){const left=i<n/2;
        if(type==="pratt")left?S([xs[i],T],[xs[i+1],B],"a"):S([xs[i+1],T],[xs[i],B],"a");
        else left?S([xs[i],B],[xs[i+1],T]):S([xs[i+1],B],[xs[i],T]);}
      xs.forEach(x=>nodes.push([x,B]));for(let i=1;i<n;i++)nodes.push([xs[i],T]);
    }
  }else{
    S([L,B],[R,B]);
    if(type==="queen"){
      const q1=L+(R-L)/3,q2=R-(R-L)/3,qy=ry(q1);
      S([L,B],[q1,qy]);S([q1,qy],[q2,qy]);S([q2,qy],[R,B]);S([q1,qy],[q1,B]);S([q2,qy],[q2,B]);
      [[L,B],[q1,qy],[q2,qy],[R,B],[q1,B],[q2,B]].forEach(p=>nodes.push(p));
    }else{
      S([L,B],[mid,P]);S([mid,P],[R,B]);
      if(type==="king"){
        const r1=(L+mid)/2,r2=(mid+R)/2;
        S([mid,P],[mid,B]);S([mid,B],[r1,ry(r1)]);S([mid,B],[r2,ry(r2)]);
        [[L,B],[mid,P],[R,B],[mid,B],[r1,ry(r1)],[r2,ry(r2)]].forEach(p=>nodes.push(p));
      }else{
        const b1=L+(R-L)/3,b2=R-(R-L)/3,r1=L+(R-L)/4,r2=R-(R-L)/4;
        S([b1,B],[r1,ry(r1)]);S([b1,B],[mid,P]);S([b2,B],[mid,P]);S([b2,B],[r2,ry(r2)]);
        [[L,B],[b1,B],[b2,B],[R,B],[r1,ry(r1)],[r2,ry(r2)],[mid,P]].forEach(p=>nodes.push(p));
      }
    }
  }
  const f=n=>+n.toFixed(1);
  let s=segs.map(([a,b,c])=>`<line class="${c}" x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}"/>`).join("");
  s+=nodes.map(p=>`<circle class="bc" cx="${f(p[0])}" cy="${f(p[1])}" r="2.6"/>`).join("");
  s+=pin(L,B)+pin(R,B);
  const leg=(type==="pratt"||type==="howe"||type==="warren")?`<text x="20" y="114" class="k">— tension</text><text x="110" y="114">— compression</text>`:"";
  return svg(300,118,s+leg);
}

function poolFor(cat){
  if(cat==="all")return ALL;
  if(cat==="community")return ALL.filter(c=>c.by);
  return ALL.filter(c=>c.cat===cat);
}
function pick(){
  let pool=poolFor(activeCat);if(!pool.length)pool=ALL;
  const k=Math.min(20,pool.length-1);
  const block=new Set(k>0?recent.slice(-k):[]);
  let cands=pool.filter(c=>!block.has(c.id));if(!cands.length)cands=pool;
  if(lastType==="quiz"||lastType==="scenario"){const nq=cands.filter(c=>c.type!=="quiz"&&c.type!=="scenario");if(nq.length)cands=nq;}
  const w=c=>(activeCat==="all"?(weights[c.cat]||1):1)*(seen.has(c.id)?0.5:1)*(c.type==="quiz"?0.7:1)*(c.by?1.2:1);
  let r=Math.random()*cands.reduce((s,c)=>s+w(c),0);
  for(const c of cands){r-=w(c);if(r<=0)return c;}
  return cands[cands.length-1];
}
function addBatch(n){
  for(let i=0;i<n;i++){
    if(sinceCheck>=10){checkEl();sinceCheck=0;}
    const c=pick();recent.push(c.id);lastType=c.type;sinceCheck++;cardEl(c);
  }
}
function setActive(el){
  if(active===el)return;
  if(active)leave(active);
  active=el;enteredAt=performance.now();el.classList.add("active");
  clearTimeout(dwellT);
  if(el.dataset.kind==="content"&&TIMED[el.dataset.type]&&!el.classList.contains("learned")){el.classList.add("timed");dwellT=setTimeout(()=>learn(el),DWELL);}
  if(el.dataset.kind==="checkpoint")fillCheck(el);
  const all=feed.children,idx=Array.prototype.indexOf.call(all,el);
  if(idx>=all.length-4)addBatch(6);
}
function leave(el){
  el.classList.remove("active");
  if(el.dataset.kind!=="content")return;
  const c=BY_ID[el.dataset.cid];if(!c)return;
  const ms=performance.now()-enteredAt;
  if(ms<1200)nudge(c.cat,-0.12);else if(ms>9000)nudge(c.cat,0.2);
  persist();
}
function xpPop(el,txt){const p=document.createElement("div");p.className="xp";p.textContent=txt;el.appendChild(p);setTimeout(()=>p.remove(),1400);}
function earn(v){let g=v;if(S.boost>0){g=v*2;S.boost--;}S.xp+=v;S.sparks+=g;return g;}
function learn(el,xp){

const SH={db:null,user:null,uid:null,isOwner:false,canWrite:null,state:"loading",votes:{},myVote:null,ideas:[],myIdeas:[]};
const str=(x,n)=>typeof x==="string"?x.trim().slice(0,n):"";
const TYPES_OK=["concept","number","scenario","myth","quiz"];
function normalize(it,by){
  if(!it||typeof it!=="object")return null;
  const id=str(it.id,40).replace(/[^A-Za-z0-9_-]/g,"");
  const type=str(it.type,12),cat=str(it.cat,20);
  if(!id||!TYPES_OK.includes(type)||!COMMUNITY_OK.has(cat))return null;
  const c={id:"u_"+id,type,cat,by,ref:str(it.ref,60)||"Community card",at:typeof it.at==="number"?it.at:0};
  if(type==="concept"){c.title=str(it.title,80);c.body=str(it.body,420);c.key=str(it.key,80);c.note=str(it.note,240);
    c.rows=Array.isArray(it.rows)?it.rows.slice(0,6).map(r=>Array.isArray(r)?[str(r[0],60),str(r[1],60)]:null).filter(r=>r&&r[0]&&r[1]):[];
    if(!c.title||!c.body)return null;}
  else if(type==="number"){c.big=str(it.big,10);c.unit=str(it.unit,24);c.title=str(it.title,80);c.body=str(it.body,420);c.note=str(it.note,240);if(!c.big||!c.title||!c.body)return null;}
  else if(type==="scenario"){c.sit=str(it.sit,220);c.do=Array.isArray(it.do)?it.do.slice(0,6).map(d=>str(d,160)).filter(Boolean):[];c.why=str(it.why,320);if(!c.sit||c.do.length<2||!c.why)return null;}
  else if(type==="myth"){c.myth=str(it.myth,160);c.fact=str(it.fact,360);if(!c.myth||!c.fact)return null;}
  else if(type==="quiz"){c.q=str(it.q,180);c.opts=Array.isArray(it.opts)?it.opts.slice(0,4).map(o=>str(o,90)).filter(Boolean):[];c.a=0;c.explain=str(it.explain,280);if(!c.q||c.opts.length<3||!c.explain)return null;}
  return c;
}
async function resolveNames(ids){
  if(!SH.user||!ids.length)return;
  try{
    const ps=await SH.user.profiles(ids);
    ids.forEach(id=>{const p=ps&&ps[id];if(p&&p.name)names[id]=p.name;});
    document.querySelectorAll("[data-author]").forEach(n=>{n.textContent="by "+authorName(n.dataset.author);});
    document.querySelectorAll("[data-authorname]").forEach(n=>{n.textContent=authorName(n.dataset.authorname);});
  }catch(e){}
}
function onCards(snap){
  authorItems={};const list=[];
  snap.docs.forEach(d=>{
    const data=d.data()||{},items=Array.isArray(data.items)?data.items:[];
    authorItems[d.id]=items.slice();
    items.forEach(it=>{const c=normalize(it,d.id);if(c)list.push(c);});
  });
  list.sort((a,b)=>a.at-b.at);
  const before=community.length;community=list;rebuild();
  if(before!==community.length)renderCats();
  resolveNames(Object.keys(authorItems));
  rerenderPanel(["create","library"]);
}
function onVotes(snap){
  const t={};let mine=null;
  snap.docs.forEach(d=>{
    const v=d.data()||{},pick=str(v.pick,20);if(!ROADMAP.some(r=>r.id===pick))return;
    const fuel=Math.max(0,Math.min(999,Math.floor(+v.fuel||0)));
    t[pick]=t[pick]||{votes:0,fuel:0};t[pick].votes++;t[pick].fuel+=fuel;
    if(d.id===SH.uid)mine={pick,fuel};
  });
  SH.votes=t;SH.myVote=mine;rerenderPanel(["fuel"]);
}
function onIdeas(snap){
  const all=[];
  snap.docs.forEach(d=>{const v=d.data()||{};(Array.isArray(v.items)?v.items:[]).forEach(it=>{const text=str(it&&it.text,300);if(text)all.push({by:d.id,text,at:+(it.at)||0});});});
  all.sort((a,b)=>b.at-a.at);SH.ideas=all;resolveNames([...new Set(all.map(i=>i.by))]);rerenderPanel(["fuel"]);
}
function dbFail(e){
  const code=e&&e.code;
  if(code==="invalid_argument"){SH.canWrite=false;return "Your access lets you read community content but not publish. Ask the CEMP admin for access.";}
  if(code==="quota_exceeded")return "The shared store is full. The owner needs to remove old entries before new ones fit.";
  if(code==="resource_exhausted")return "Too many changes at once. Wait a few seconds and try again.";
  return "That did not save. Check your connection and try again.";
}
async function initShared(){
  const use=window.claude&&window.claude.use;
  if(!use){SH.state="off";rerenderPanel(["create","fuel"]);return;}
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    SH.db=db;SH.user=user;
    if(!db){SH.state="off";rerenderPanel(["create","fuel"]);return;}
    if(user){
      try{SH.uid=await user.id();}catch(e){}
      try{SH.isOwner=!!(await user.isOwner());}catch(e){}
      try{SH.canWrite=await user.can("data.write");}catch(e){SH.canWrite=null;}
    }
    let slowT=setTimeout(()=>{if(SH.state==="loading"){SH.state="slow";rerenderPanel(["create","fuel","library"]);}},10000);
    const ready=snap=>{if(!snap.metadata||!snap.metadata.fromCache){clearTimeout(slowT);if(SH.state!=="ready"){SH.state="ready";rerenderPanel(["create","fuel"]);}}};
    const err=e=>{clearTimeout(slowT);SH.state="error";rerenderPanel(["create","fuel"]);};
    db.collection("cards").onSnapshot(s=>{ready(s);onCards(s);},err);
    db.collection("votes").onSnapshot(s=>{ready(s);onVotes(s);},()=>{});
    if(SH.uid){
      try{const mine=await db.doc("ideas/"+SH.uid).get();SH.myIdeas=mine.exists&&Array.isArray(mine.data().items)?mine.data().items.slice():[];}catch(e){}
    }
    let canSeeIdeas=SH.isOwner;
    if(!canSeeIdeas&&user){try{canSeeIdeas=!!(await user.canEdit());}catch(e){}}
    if(canSeeIdeas)db.collection("ideas").onSnapshot(onIdeas,()=>{});
  }catch(e){SH.state="off";rerenderPanel(["create","fuel"]);}
}
const canPublish=()=>SH.db&&SH.uid&&SH.canWrite!==false&&(SH.state==="ready"||SH.state==="slow");
function sharedStatus(what){
  if(SH.state==="loading")return `<p class="status">Connecting to the shared ${what}…</p>`;
  if(SH.state==="slow")return `<p class="status warn">The shared ${what} can't be reached yet. What you see may be out of date.</p>`;
  if(SH.state==="off")return `<p class="status warn">The shared ${what} need a connection to CEMP. Everything else still works offline.</p>`;
  if(SH.state==="error")return `<p class="status warn">The shared ${what} stopped responding. Reopen the page to reconnect.</p>`;
  if(!SH.uid||SH.canWrite===false)return `<p class="status">You can read the shared ${what}. Posting needs a CEMP account.</p>`;
  return "";
}

function buy(id){
  let price=0,done="";
  if(id.startsWith("pack:")){const p=PACKS.find(x=>"pack:"+x.id===id);if(!p||owned.has(id))return;price=p.price;}
  else if(id.startsWith("accent:")){const a=ACCENTS.find(x=>"accent:"+x.id===id);if(!a||owned.has(id))return;price=a.price;}
  else{const p=POWER.find(x=>x.id===id);if(!p)return;price=p.price;if(id==="freeze"&&S.freezes>=2)return;}
  if(S.sparks<price){toast("Not enough sparks yet. Keep scrolling to earn more.");return;}
  S.sparks-=price;
  if(id.startsWith("pack:")){owned.add(id);rebuild();renderCats();const p=PACKS.find(x=>"pack:"+x.id===id);done=p.name+" unlocked. Its cards are now in your feed.";}
  else if(id.startsWith("accent:")){owned.add(id);applyAccent(id.slice(7));done="New accent applied.";}
  else if(id==="freeze"){S.freezes++;done="Streak Freeze added.";}
  else if(id==="boost"){S.boost+=20;done="Focus Boost on: double sparks for 20 cards.";}
  confirmBuy=null;persist();refresh();renderMarket();toast(done);
}

function readDraft(){const d={};CR_FIELDS.forEach(id=>{const el=document.getElementById(id);if(el)d[id]=el.value;});return d;}
function buildCard(d){
  const t=(k,n)=>str(d[k],n);const type=d.crType||"concept";
  const c={type,cat:d.crTopic||"rebar",ref:t("crRef",60)};
  if(type==="concept"){c.title=t("crTitle",80);c.body=t("crBody",420);c.key=t("crKey",80);c.note=t("crNote",240);
    c.rows=String(d.crRows||"").split("\n").map(l=>l.split("|")).filter(p=>p.length>=2).slice(0,6).map(p=>[p[0].trim().slice(0,60),p.slice(1).join("|").trim().slice(0,60)]).filter(r=>r[0]&&r[1]);
    if(!c.title||!c.body)return {err:"Add a title and an explanation."};}
  else if(type==="number"){c.big=t("crBig",10);c.unit=t("crUnit",24);c.title=t("crTitle",80);c.body=t("crBody",420);c.note=t("crNote",240);if(!c.big||!c.title||!c.body)return {err:"Add the big number, a title and an explanation."};}
  else if(type==="scenario"){c.sit=t("crSit",220);c.do=String(d.crSteps||"").split("\n").map(s=>s.trim().slice(0,160)).filter(Boolean).slice(0,6);c.why=t("crWhy",320);if(!c.sit||c.do.length<2||!c.why)return {err:"Add the situation, at least 2 steps (one per line) and the reason why."};}
  else if(type==="myth"){c.myth=t("crMyth",160);c.fact=t("crFact",360);if(!c.myth||!c.fact)return {err:"Add both the myth and the fact."};}
  else if(type==="quiz"){c.q=t("crQ",180);c.opts=[t("crA",90),t("crW1",90),t("crW2",90),t("crW3",90)].filter(Boolean);c.a=0;c.explain=t("crExplain",280);if(!c.q||!t("crA",90)||c.opts.length<3||!c.explain)return {err:"Add the question, the correct answer, at least 2 wrong answers and an explanation."};}
  return {card:c};
}
function syncCreateForm(){
  const d=readDraft();const type=d.crType||"concept";

  const m=Math.floor((Date.now()-t0)/60000);
  return {today:S.today.count,session:sess.learned,streak:S.streak.count+(S.streak.count===1?" day":" days"),streakN:S.streak.count,
    xp:S.xp.toLocaleString(),sparks:S.sparks.toLocaleString(),acc:sess.qT?Math.round(100*sess.qR/sess.qT)+"%":"—",minutes:m+" min",saved:saved.size};
}
function refresh(){
  const st=stats();
  document.querySelectorAll("[data-stat]").forEach(n=>{const v=st[n.dataset.stat];if(v!==undefined)n.textContent=v;});
  document.querySelectorAll("[data-navcount]").forEach(n=>{n.textContent=n.dataset.navcount==="saved"?saved.size:st.sparks;});
  rerenderPanel(["stats","market"]);
}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);}

/* =====================================================================
   EVENTS
   ===================================================================== */
let lastTap=0,lx=0,ly=0;
feed.addEventListener("click",e=>{
  const card=e.target.closest(".card");if(!card)return;
  const opt=e.target.closest(".opt");if(opt){answer(card,opt);return;}
  if(e.target.closest("[data-reveal]")){reveal(card);return;}
  const dot=e.target.closest("[data-go]");if(dot){showStep(card,+dot.dataset.go);return;}
  if(e.target.closest("[data-stepnext]")){stepNext(card);return;}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="like")like(card,false);
  else if(a==="save")toggleSave(card);
  else if(a==="share")share(card);
  else if(a==="next"){if(card!==active&&card.scrollIntoView)card.scrollIntoView({block:"start"});go(1);}
});
feed.addEventListener("pointerup",e=>{
  if(e.button>0||e.target.closest("button,a"))return;
  const card=e.target.closest('.card[data-kind="content"]');if(!card)return;
  const now=performance.now();
  if(now-lastTap<320&&Math.hypot(e.clientX-lx,e.clientY-ly)<40){like(card,true,e.clientX,e.clientY);lastTap=0;}
  else{lastTap=now;lx=e.clientX;ly=e.clientY;}
});
pb.addEventListener("click",e=>{
  const pv=e.target.closest(".card.pv");
  if(pv){const opt=e.target.closest(".opt");if(opt){answer(pv,opt);return;}if(e.target.closest("[data-reveal]")){reveal(pv);return;}}
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  const ds=t.dataset;
  if(ds.mode){applyMode(ds.mode);return;}
  if(ds.open&&!t.closest(".card:not(.t-welcome):not(.t-check)")){confirmBuy=null;openPanel(ds.open);return;}
  if(ds.tab==="feed"){closePanel();feed.focus({preventScroll:true});return;}
  if(ds.cat){setCat(ds.cat);return;}
  if(ds.dive){openPanel("dive",ds.dive);return;}
  if(ds.card){showInFeed(ds.card);return;}
  if(ds.libtab){libTab=ds.libtab;renderLibrary();return;}
  if(ds.diveread){if(!divesRead.has(ds.diveread)){divesRead.add(ds.diveread);const g=earn(30);persist();refresh();toast("Deep dive read. +"+g+" sparks");}renderDive();return;}
  if(ds.buy!=null){if(ds.confirm){buy(ds.buy);}else{confirmBuy=ds.buy;renderMarket();}return;}
  if(ds.accent){applyAccent(ds.accent);renderMarket();toast("Accent applied.");return;}
  if(ds.unsave){saved.delete(ds.unsave);syncBtns(ds.unsave);persist();refresh();renderSaved();toast("Removed from your saved board");return;}
  if(t.hasAttribute("data-cempreview")){S.cempReview=t.getAttribute("data-cempreview")==="1";persist();loadCemp(true);return;}
  if(t.hasAttribute("data-resetmix")){CATS.forEach(c=>weights[c.id]=1);persist();renderStats();toast("Feed mix reset");return;}
  if(t.hasAttribute("data-crclear")){S.draft={crType:(S.draft||{}).crType,crTopic:(S.draft||{}).crTopic};persist();renderCreate();return;}
  if(ds.delcard){if(ds.confirm){deleteCard(ds.delcard,ds.owner);}else{t.dataset.confirm="1";t.textContent="Confirm delete";}return;}
  if(ds.vote){castVote(ds.vote,false);return;}
  if(t.hasAttribute("data-boost")){if(SH.myVote)castVote(SH.myVote.pick,true);return;}
  if(t.hasAttribute("data-idea")){sendIdea();return;}
  if(ds.copysup!=null){const s=SUPPORT.filter(x=>x.value)[+ds.copysup];if(s)copyText(s.value,s.label+" details copied.");return;}
});
pb.addEventListener("input",e=>{
  if(e.target.id==="libSearch"){libQuery=e.target.value;renderLibList();return;}
  if(e.target.closest("#crForm")){S.draft=readDraft();persist();syncCreateForm();}
});
pb.addEventListener("change",e=>{if(e.target.closest("#crForm")){S.draft=readDraft();persist();syncCreateForm();}});
pb.addEventListener("submit",e=>{if(e.target.id==="crForm"){e.preventDefault();publishCard();}});
$("#panelClose").addEventListener("click",closePanel);
$("#backdrop").addEventListener("click",closePanel);
document.addEventListener("keydown",e=>{
  if(!panel.hidden){if(e.key==="Escape")closePanel();return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key,onBtn=!!(e.target.closest&&e.target.closest("button"));
  if(k==="ArrowDown"||k==="PageDown"||k==="j"||(k===" "&&!onBtn)){e.preventDefault();go(1);}
  else if(k==="ArrowUp"||k==="PageUp"||k==="k"){e.preventDefault();go(-1);}
  else if(!active||!active.dataset.cid)return;
  else if(k==="l"||k==="L")like(active,false);
  else if(k==="s"||k==="S")toggleSave(active);
  else if(k==="ArrowRight"&&active.dataset.type==="steps"){e.preventDefault();showStep(active,+(active.dataset.at||0)+1);}
  else if(k==="ArrowLeft"&&active.dataset.type==="steps"){e.preventDefault();showStep(active,+(active.dataset.at||0)-1);}
  else if(k==="Enter"&&!onBtn&&active.dataset.type==="scenario")reveal(active);
  else if(/^[1-4]$/.test(k)&&active.dataset.type==="quiz"){const o=active.querySelectorAll(".opt")[+k-1];if(o)answer(active,o);}
});

  .map(([v,l,ic,n])=>`<button type="button" data-open="${v}">${ic}${l}${n?`<span class="count" data-navcount="${n}"></span>`:""}</button>`).join("");

/* v2.6.0: fetch CEMP Practice cards (published; editors/admin may include entries still in review). */
async function loadCemp(announce){
  try{
    const r=await fetch("/api/scroll/cemp"+(S.cempReview?"?review=1":""),{credentials:"same-origin"});
    if(!r.ok||!(r.headers.get("content-type")||"").includes("json"))return;
    const j=await r.json();if(!Array.isArray(j.cards))return;
    const before=cempCards.length;cempCards=j.cards;cempCanReview=!!j.canReview;
    try{localStorage.setItem(CEMP_KEY,JSON.stringify({cards:j.cards,canReview:cempCanReview,at:j.at}));}catch(e){}
    rebuild();renderCats();rerenderPanel(["menu","library","saved"]);
    if(announce||(!before&&cempCards.length))toast(`${cempCards.length} CEMP Practice card${cempCards.length===1?"":"s"} in your feed`);
  }catch(e){/* offline: keep the cached cards */}
}
}
